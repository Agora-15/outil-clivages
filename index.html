<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Modèle Moléculaire 12</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        
        .scene { width: 300px; height: 300px; perspective: 700px; margin-top: 20px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        
        .structure {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
        }
        
        .face {
            position: absolute; width: 80px; height: 80px;
            left: 110px; top: 110px;
            border: 1.5px solid #007aff;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; text-align: center;
            box-sizing: border-box; padding: 5px;
            backface-visibility: visible; cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .face.locked {
            background: rgba(142, 142, 147, 0.18) !important;
            color: #4a4a4a !important;
            border-color: #8e8e93 !important;
            cursor: not-allowed !important;
        }
        
        /* CORRECTIONS STRICTES DES AXES DU DODÉCAÈDRE (12 FACES AU TOTAL) */
        /* Les 8 Faces Verticales de la Couronne (Espacées rigoureusement de 45°) */
        .fV0  { transform: rotateY(   0deg) translateZ(100px); }
        .fV1  { transform: rotateY( 180deg) translateZ(100px); }
        .fV2  { transform: rotateY(  90deg) translateZ(100px); }
        .fV3  { transform: rotateY( -90deg) translateZ(100px); }
        .fV4  { transform: rotateY(  45deg) translateZ(100px); }
        .fV5  { transform: rotateY(-135deg) translateZ(100px); }
        .fV6  { transform: rotateY( -45deg) translateZ(100px); }
        .fV7  { transform: rotateY( 135deg) translateZ(100px); }
        
        /* Les 2 Faces Horizontales */
        .fH0  { transform: rotateX(  90deg) translateZ(100px); }
        .fH1  { transform: rotateX( -90deg) translateZ(100px); }
        
        /* Les 2 Axes Inclinés Restants */
        .fA0  { transform: rotateX(  45deg) translateZ(100px); }
        .fA1  { transform: rotateX(-135deg) translateZ(100px); }

        #control-widget {
            position: absolute; bottom: 40px;
            background: rgba(255, 255, 255, 0.95); border: 1px solid #e5e5ea;
            padding: 15px 45px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center; min-width: 280px; opacity: 0; transform: translateY(20px);
            transition: all 0.4s; pointer-events: none;
        }
        #control-widget.visible { opacity: 1; transform: translateY(0); }
        .widget-title { font-size: 15px; font-weight: 600; color: #1c1c1e; margin-bottom: 4px; }
        .scroll-instruction { font-size: 12px; color: #007aff; font-weight: 500; }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Structure corrigée : 8 disques verticaux, 2 horizontaux, 2 inclinés (12 options).</p>

    <div class="scene" id="scene">
        <div class="structure" id="structure">
            <!-- Habillage exact des 12 faces avec vos 6 premiers duos fondamentaux -->
            <div class="face fV0" id="face-0" data-opp="face-1" data-name="GLOBALISME" data-score="0">GLOBALISME</div>
            <div class="face fV1" id="face-1" data-opp="face-0" data-name="SOUVERAINISME" data-score="0">SOUVERAINISME</div>
            <div class="face fV2" id="face-2" data-opp="face-3" data-name="ÉGALITARISME" data-score="0">ÉGALITARISME</div>
            <div class="face fV3" id="face-3" data-opp="face-2" data-name="MÉRITOCRATIE" data-score="0">MÉRITOCRATIE</div>
            <div class="face fV4" id="face-4" data-opp="face-5" data-name="TECHNOCRATIE" data-score="0">TECHNOCRATIE</div>
            <div class="face fV5" id="face-5" data-opp="face-4" data-name="POPULISME" data-score="0">POPULISME</div>
            <div class="face fV6" id="face-6" data-opp="face-7" data-name="FÉMINISME" data-score="0">FÉMINISME</div>
            <div class="face fV7" id="face-7" data-opp="face-6" data-name="PATRIARCAT" data-score="0">PATRIARCAT</div>
            
            <div class="face fH0" id="face-8" data-opp="face-9" data-name="AUTORITARISME" data-score="0">AUTORITARISME</div>
            <div class="face fH1" id="face-9" data-opp="face-8" data-name="LIBERTARIANISME" data-score="0">LIBERTARIANISME</div>
            
            <div class="face fA0" id="face-10" data-opp="face-11" data-name="PROGRESSISME" data-score="0">PROGRESSISME</div>
            <div class="face fA1" id="face-11" data-opp="face-10" data-name="CONSERVATISME" data-score="0">CONSERVATISME</div>
        </div>
    </div>
    <div id="control-widget">
        <div class="widget-title" id="active-face-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>
    <script>
        const scene = document.getElementById('scene'), structure = document.getElementById('structure'), faces = document.querySelectorAll('.face'), widget = document.getElementById('control-widget'), widgetTitle = document.getElementById('active-face-name');
        let drag = false, cibleX = -20, cibleY = 20, rotationX = -20, rotationY = 20, vitesseX = 0, vitesseY = 0, dernierX = 0, dernierY = 0, faceSelectionnee = null;

        scene.addEventListener('mousedown', (e) => {
            drag = true; vitesseX = 0; vitesseY = 0;
            dernierX = e.clientX; dernierY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!drag) return;
            const deltaX = e.clientX - dernierX, deltaY = e.clientY - dernierY;
            vitesseY = deltaX * 0.35; vitesseX = deltaY * 0.35;
            cibleY += vitesseY; cibleX -= vitesseX;
            dernierX = e.clientX; dernierY = e.clientY;
        });

        window.addEventListener('mouseup', () => { drag = false; });

        function bouclePhysique() {
            if (!drag) { vitesseX *= 0.975; vitesseY *= 0.975; cibleY += vitesseY; cibleX -= vitesseX; }
            rotationX += (cibleX - rotationX) * 0.12; rotationY += (cibleY - rotationY) * 0.12;
            structure.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            requestAnimationFrame(bouclePhysique);
        }
        bouclePhysique();

        function rafraichirCouleurFace(face) {
            const score = parseInt(face.getAttribute('data-score')), nomOrigine = face.getAttribute('data-name'), faceOpposee = document.getElementById(face.getAttribute('data-opp')), nomOpposeOrigine = faceOpposee.getAttribute('data-name');
            if (score > 0) {
                face.style.background = `rgba(0, 122, 255, ${0.2 + (score * 0.07)})`; face.style.color = score > 5 ? '#ffffff' : '#1c1c1e'; face.style.borderColor = '#0056b3'; face.innerText = nomOrigine + " : +" + score; face.classList.remove('locked');
                faceOpposee.classList.add('locked'); faceOpposee.innerText = nomOpposeOrigine + " : " + (-(20 - score)); faceOpposee.style.background = ''; faceOpposee.style.color = ''; faceOpposee.setAttribute('data-score', '0'); 
            } else {
                face.style.background = 'rgba(255, 255, 255, 0.85)'; face.style.color = '#1c1c1e'; face.style.borderColor = '#007aff'; face.innerText = nomOrigine;
                faceOpposee.classList.remove('locked'); faceOpposee.style.background = 'rgba(255, 255, 255, 0.85)'; faceOpposee.style.color = '#1c1c1e'; faceOpposee.style.borderColor = '#007aff'; faceOpposee.innerText = nomOpposeOrigine;
            }
        }

        faces.forEach(face => {
            face.addEventListener('click', () => {
                if (Math.abs(vitesseX) > 0.3 || Math.abs(vitesseY) > 0.3 || face.classList.contains('locked')) return;
                if (faceSelectionnee && faceSelectionnee !== face && !faceSelectionnee.classList.contains('locked')) rafraichirCouleurFace(faceSelectionnee);
                faceSelectionnee = face;
                if (parseInt(face.getAttribute('data-score')) === 0) face.style.background = 'rgba(0, 122, 255, 0.4)';
                widget.classList.add('visible'); widgetTitle.innerText = face.getAttribute('data-name') + " (+" + face.getAttribute('data-score') + ")";
            });
        });

        window.addEventListener('wheel', (e) => {
            if (faceSelectionnee && !faceSelectionnee.classList.contains('locked')) {
                e.preventDefault(); let score = parseInt(faceSelectionnee.getAttribute('data-score'));
                score = e.deltaY < 0 ? Math.min(score + 1, 10) : Math.max(score - 1, 0);
                faceSelectionnee.setAttribute('data-score', score); rafraichirCouleurFace(faceSelectionnee);
                widgetTitle.innerText = faceSelectionnee.getAttribute('data-name') + " (+" + score + ")";
            }
        }, { passive: false });
    </script>
</body>
</html>
