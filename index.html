<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Modèle Stable</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        .scene { width: 220px; height: 220px; perspective: 800px; perspective-origin: 50% 50%; margin-top: 20px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            transform-origin: 50% 50% 0px;
        }
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            backface-visibility: visible; cursor: pointer;
            transition: all 0.2s ease; transform-origin: 50% 50% 0px;
        }
        .face.locked {
            background: rgba(142, 142, 147, 0.18) !important;
            color: #4a4a4a !important;
            border-color: #8e8e93 !important;
            cursor: not-allowed !important;
            font-weight: 500;
        }
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }
        #control-widget {
            position: absolute; bottom: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e5ea; padding: 15px 45px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center; min-width: 280px;
            opacity: 0; transform: translateY(20px);
            transition: all 0.4s; pointer-events: none;
        }
        #control-widget.visible { opacity: 1; transform: translateY(0); }
        .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; margin-bottom: 4px; }
        .scroll-instruction { font-size: 12px; color: #007aff; font-weight: 500; }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Cliquez pour sélectionner. Utilisez la molette pour ajuster. Glissez pour tourner.</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="face front" id="f-glob" data-opp="f-souv" data-name="GLOBALISME" data-score="0">GLOBALISME</div>
            <div class="face back" id="f-souv" data-opp="f-glob" data-name="SOUVERAINISME" data-score="0">SOUVERAINISME</div>
            <div class="face right" id="f-egal" data-opp="f-meri" data-name="ÉGALITARISME" data-score="0">ÉGALITARISME</div>
            <div class="face left" id="f-meri" data-opp="f-egal" data-name="MÉRITOCRATIE" data-score="0">MÉRITOCRATIE</div>
            <div class="face top" id="f-tech" data-opp="f-popu" data-name="TECHNOCRATIE" data-score="0">TECHNOCRATIE</div>
            <div class="face bottom" id="f-popu" data-opp="f-tech" data-name="POPULISME" data-score="0">POPULISME</div>
        </div>
    </div>

    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');
        const widget = document.getElementById('control-widget');
        const wTitle = document.getElementById('act-name');

        let drag = false;
        let cibleX = -20, cibleY = 20;
        let rotationX = -20, rotationY = 20;
        let vitesseX = 0, vitesseY = 0;
        let dernierX = 0, dernierY = 0;
        const friction = 0.975;
        const sensibilite = 0.35;
        let sel = null;

        function obtenirDirectionAxeY() {
            const radX = rotationX * Math.PI / 180;
            const radY = rotationY * Math.PI / 180;
            return (Math.cos(radX) * Math.cos(radY)) >= 0 ? 1 : -1;
        }

        function CommencerGlisser(e) {
            drag = true; vitesseX = 0; vitesseY = 0;
            dernierX = e.clientX || (e.touches && e.touches[0].clientX);
            dernierY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        function Glisser(e) {
            if (!drag) return;
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            const dX = x - dernierX;
            const dY = y - dernierY;
            const dirY = obtenirDirectionAxeY();
            vitesseY = dX * sensibilite * dirY;
            vitesseX = dY * sensibilite;
            cibleY += vitesseY;
            cibleX -= vitesseX;
            dernierX = x; dernierY = y;
        }

        function ArreterGlisser() { drag = false; }

        scene.addEventListener('mousedown', CommencerGlisser);
        window.addEventListener('mousemove', Glisser);
        window.addEventListener('mouseup', ArreterGlisser);
        scene.addEventListener('touchstart', CommencerGlisser, { passive: true });
        window.addEventListener('touchmove', Glisser, { passive: true });
        window.addEventListener('touchend', ArreterGlisser);

        function bouclePhysique() {
            if (!drag) {
                vitesseX *= friction; vitesseY *= friction;
                cibleY += vitesseY; cibleX -= vitesseX;
            }
            rotationX += (cibleX - rotationX) * 0.12;
            rotationY += (cibleY - rotationY) * 0.12;
            cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            requestAnimationFrame(bouclePhysique);
        }
        bouclePhysique();

        function color(f) {
            const s = parseInt(f.getAttribute('data-score'));
            const n = f.getAttribute('data-name');
            const opp = document.getElementById(f.getAttribute('data-opp'));
            const oName = opp.getAttribute('data-name');
            if (s > 0) {
                f.style.background = `rgba(0,122,255,${0.2+(s*0.07)})`;
                f.style.color = s > 5 ? '#fff' : '#1c1c1e';
                f.style.borderColor = '#0056b3';
                f.innerText = n + " : +" + s;
                f.classList.remove('locked');
                const scoreInverse = -(20 - s);
                opp.classList.add('locked');
                opp.innerText = oName + " : " + scoreInverse;
                opp.style.background = ''; opp.style.color = '';
            } else {
                f.style.background = 'rgba(255,255,255,0.9)';
                f.style.color = '#1c1c1e';
                f.style.borderColor = '#007aff';
                f.innerText = n;
                opp.classList.remove('locked');
                opp.style.background = 'rgba(255,255,255,0.9)';
                opp.style.color = '#1c1c1e';
                opp.style.borderColor = '#007aff';
                opp.innerText = oName;
            }
        }

        faces.forEach(f => {
            f.addEventListener('click', () => {
                if (Math.abs(vitesseX) > 0.3 || Math.abs(vitesseY) > 0.3 || f.classList.contains('locked')) return;
                if (sel && sel !== f && !sel.classList.contains('locked')) color(sel);
                sel = f;
                if (parseInt(f.getAttribute('data-score')) === 0) f.style.background = 'rgba(0, 122, 255, 0.4)';
                widget.classList.add('visible');
                wTitle.innerText = f.getAttribute('data-name') + " (+" + f.getAttribute('data-score') + ")";
            });
        });

        window.addEventListener('wheel', (e) => {
            if (sel && !sel.classList.contains('locked')) {
                e.preventDefault();
                let s = parseInt(sel.getAttribute('data-score'));
                s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0);
                sel.setAttribute('data-score', s);
                color(sel);
                wTitle.innerText = sel.getAttribute('data-name') + " (+" + s + ")";
            }
        }, { passive: false });
    </script>
</body>
</html>
