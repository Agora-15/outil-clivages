<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora-15 | Modèle Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #info-overlay { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; color: #1c1c1e; z-index: 10; }
        h1 { font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0 0 5px 0; text-transform: uppercase; }
        p { font-size: 14px; color: #8e8e93; margin: 0; }
        #control-widget { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); border: 1px solid #e5e5ea; padding: 15px 45px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; min-width: 280px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 10; }
        #control-widget.visible { opacity: 1; }
        .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; }
        .scroll-instruction { font-size: 12px; color: #007aff; margin-top: 5px; }
    </style>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div id="info-overlay">
        <h1>Agora-15</h1>
        <p>Maintenez le clic pour tourner. Cliquez sur une face pour interagir.</p>
    </div>
    <div id="canvas-container"></div>
    <div id="control-widget">
        <div class="widget-title" id="active-face-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster de 0 à +10</div>
    </div>
    <script>
        const container = document.getElementById('canvas-container'), widget = document.getElementById('control-widget'), wTitle = document.getElementById('active-face-name');
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100); camera.position.set(0, 0, 6);
        const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio || 1); container.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.05; controls.rotateSpeed = 0.8;
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4); dirLight.position.set(5, 10, 7); scene.add(dirLight);

        const clivages = [
            { name: "GLOBALISME", oppId: 1, score: 0 }, { name: "SOUVERAINISME", oppId: 0, score: 0 },
            { name: "ÉGALITARISME", oppId: 3, score: 0 }, { name: "MÉRITOCRATIE", oppId: 2, score: 0 },
            { name: "TECHNOCRATIE", oppId: 5, score: 0 }, { name: "POPULISME", oppId: 4, score: 0 }
        ];

        const cubeGroup = new THREE.Group(); scene.add(cubeGroup);
        const facesMesh = [], geometry = new THREE.PlaneGeometry(2, 2);
        
        // Coordonnées géométriques réparées et complétées à 100%
        const configs = [
            { pos: [0, 0, 1], rot: [0, 0, 0] },
            { pos: [0, 0, -1], rot: [0, Math.PI, 0] },
            { pos: [1, 0, 0], rot: [0, Math.PI / 2, 0] },
            { pos: [-1, 0, 0], rot: [0, -Math.PI / 2, 0] },
            { pos: [0, 1, 0], rot: [-Math.PI / 2, 0, 0] },
            { pos: [0, -1, 0], rot: [Math.PI / 2, 0, 0] }
        ];

        for (let i = 0; i < 6; i++) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 256); ctx.strokeStyle = '#007aff'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, 256, 256);
            ctx.fillStyle = '#1c1c1e'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(clivages[i].name, 128, 128);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshPhongMaterial({ map: texture, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
            const mesh = new THREE.Mesh(geometry, material); mesh.position.set(configs[i].pos[0], configs[i].pos[1], configs[i].pos[2]); mesh.rotation.set(configs[i].rot[0], configs[i].rot[1], configs[i].rot[2]);
            mesh.userData = { id: i, canvas: canvas, ctx: ctx, locked: false };
            cubeGroup.add(mesh); facesMesh.push(mesh);
        }

        function rafraichirTextureFace(id) {
            const m = facesMesh[id], ctx = m.userData.ctx, data = clivages[id];
            ctx.clearRect(0, 0, 256, 256);
            if (m.userData.locked) {
                ctx.fillStyle = '#e5e5ea'; ctx.fillRect(0, 0, 256, 256); ctx.strokeStyle = '#8e8e93'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, 256, 256);
                ctx.fillStyle = '#333333'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(data.name, 128, 100); ctx.fillText(data.score, 128, 150); m.material.opacity = 0.5;
            } else if (data.score > 0) {
                ctx.fillStyle = '#007aff'; ctx.fillRect(0, 0, 256, 256); ctx.strokeStyle = '#0056b3'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, 256, 256);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(data.name, 128, 100); ctx.fillText("+" + data.score, 128, 150); m.material.opacity = 0.4 + (data.score * 0.06);
            } else {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 256); ctx.strokeStyle = '#007aff'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, 256, 256);
                ctx.fillStyle = '#1c1c1e'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(data.name, 128, 128); m.material.opacity = 0.95;
            }
            m.material.map.needsUpdate = true;
        }

        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(); let selId = null;
        window.addEventListener('click', (e) => {
            if (e.clientY > window.innerHeight - 100) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(cubeGroup.children);
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object; const id = hitMesh.userData.id;
                if (hitMesh.userData.locked) return;
                selId = id; widget.classList.add('visible'); wTitle.innerText = clivages[id].name + " (+" + clivages[id].score + ")";
            }
        });

        window.addEventListener('wheel', (e) => {
            if (selId !== null) {
                e.preventDefault(); controls.enableZoom = false;
                let s = clivages[selId].score; s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0); clivages[selId].score = s;
                const oppId = clivages[selId].oppId;
                if (s > 0) { clivages[oppId].score = -(20 - s); facesMesh[oppId].userData.locked = true; } 
                else { clivages[oppId].score = 0; facesMesh[oppId].userData.locked = false; }
                rafraichirTextureFace(selId); rafraichirTextureFace(oppId);
                wTitle.innerText = clivages[selId].name + " (+" + s + ")";
                setTimeout(() => { controls.enableZoom = true; }, 150);
            }
        }, { passive: false });

        function animate() {
            requestAnimationFrame(animate);
            if (selId === null) { cubeGroup.rotation.y += 0.001; cubeGroup.rotation.x += 0.0005; }
            controls.update(); renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
</html>
