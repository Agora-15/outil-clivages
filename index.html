<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Socle Stable Corrigé</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; overflow:hidden; user-select:none; }
        h1 { position:absolute; top:30px; text-transform:uppercase; letter-spacing:2px; font-weight:300; }
        p { position:absolute; top:80px; color:#8e8e93; font-size:14px; text-align:center; }
        .scene { width:220px; height:220px; perspective:600px; margin-top:20px; cursor:grab; }
        .scene:active { cursor:grabbing; }
        .cube { width:100%; height:100%; position:relative; transform-style:preserve-3d; transform:rotateX(-20deg) rotateY(20deg); }
        .face { position:absolute; width:80px; height:80px; left:70px; top:70px; border:2px solid #007aff; border-radius:50%; background:rgba(255,255,255,0.9); color:#1c1c1e; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:600; text-align:center; box-sizing:border-box; padding:5px; backface-visibility:visible; cursor:pointer; transition:all 0.2s; }
        .face.locked { background:rgba(142,142,147,0.18)!important; color:#4a4a4a!important; border-color:#8e8e93!important; cursor:not-allowed!important; font-weight:500; }
        
        /* 1er niveau de la ceinture : 5 cercles verticaux espacés de 72° */
        .fV0  { transform: rotateY(   0deg) translateZ(110px); }
        .fV1  { transform: rotateY(  72deg) translateZ(110px); }
        .fV2  { transform: rotateY( 144deg) translateZ(110px); }
        .fV3  { transform: rotateY( 216deg) translateZ(110px); }
        .fV4  { transform: rotateY( 288deg) translateZ(110px); }
        
        /* 2ème niveau de la ceinture : 5 cercles verticaux alternés (décalés de 36°) */
        .fV5  { transform: rotateY(  36deg) translateZ(110px); }
        .fV6  { transform: rotateY( 108deg) translateZ(110px); }
        .fV7  { transform: rotateY( 180deg) translateZ(110px); }
        .fV8  { transform: rotateY( 252deg) translateZ(110px); }
        .fV9  { transform: rotateY( 324deg) translateZ(110px); }
        
        /* Les 2 Axes Inclinés à 45° */
        .fA0  { transform: rotateX(  45deg) translateZ(110px); }
        .fA1  { transform: rotateX(-135deg) translateZ(110px); }
        
        #control-widget { position:absolute; bottom:40px; background:rgba(255,255,255,0.95); border:1px solid #e5e5ea; padding:15px 45px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.05); text-align:center; min-width:280px; opacity:0; transform:translateY(20px); transition:all 0.4s; pointer-events:none; }
        #control-widget.visible { opacity:1; transform:translateY(0); }
        .widget-title { font-size:16px; font-weight:600; color:#1c1c1e; margin-bottom:4px; }
        .scroll-instruction { font-size:12px; color:#007aff; font-weight:500; }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Ceinture de 10 cercles (2 niveaux de 5), 2 inclinés, 0 horizontaux.</p>
    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <!-- Ceinture - 1er Niveau de 5 -->
            <div class="face fV0" id="f-glob" data-opp="f-souv" data-name="GLOBALISME" data-score="0">GLOBALISME</div>
            <div class="face fV1" id="f-egal" data-opp="f-meri" data-name="ÉGALITARISME" data-score="0">ÉGALITARISME</div>
            <div class="face fV2" id="f-tech" data-opp="f-popu" data-name="TECHNOCRATIE" data-score="0">TECHNOCRATIE</div>
            <div class="face fV3" id="f-femi" data-opp="f-patr" data-name="FÉMINISME" data-score="0">FÉMINISME</div>
            <div class="face fV4" id="f-esse" data-opp="f-cons" data-name="ESSENTIALISME" data-score="0">ESSENTIALISME</div>
            
            <!-- Ceinture - 2ème Niveau de 5 -->
            <div class="face fV5" id="f-roya" data-opp="f-repu" data-name="ROYALISME" data-score="0">ROYALISME</div>
            <div class="face fV6" id="f-souv" data-opp="f-glob" data-name="SOUVERAINISME" data-score="0">SOUVERAINISME</div>
            <div class="face fV7" id="f-meri" data-opp="f-egal" data-name="MÉRITOCRATIE" data-score="0">MÉRITOCRATIE</div>
            <div class="face fV8" id="f-popu" data-opp="f-tech" data-name="POPULISME" data-score="0">POPULISME</div>
            <div class="face fV9" id="f-patr" data-opp="f-femi" data-name="PATRIARCAT" data-score="0">PATRIARCAT</div>
            
            <!-- Les 2 Axes Inclinés Restants -->
            <div class="face fA0" id="f-cons" data-opp="f-esse" data-name="CONSTRUCTIVISME" data-score="0">CONSTRUCTIVISME</div>
            <div class="face fA1" id="f-repu" data-opp="f-roya" data-name="RÉPUBLICANISME" data-score="0">RÉPUBLICANISME</div>
        </div>
    </div>
    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>
    <script>
        const scene=document.getElementById('scene'), cube=document.getElementById('cube'), faces=document.querySelectorAll('.face'), widget=document.getElementById('control-widget'), wTitle=document.getElementById('act-name');
        let drag=false, cX=-20, cY=20, rX=-20, rY=20, vX=0, vY=0, lX=0, lY=0, sel=null;
        
        scene.addEventListener('mousedown', (e)=>{ drag=true; vX=0; vY=0; lX=e.clientX; lY=e.clientY; });
        window.addEventListener('mousemove', (e)=>{ if(!drag)return; const dX=e.clientX-lX, dY=e.clientY-lY; vY=dX*0.35; vX=dY*0.35; cY+=vY; cX-=vX; lX=e.clientX; lY=e.clientY; });
        window.addEventListener('mouseup', ()=>{ drag=false; });
        scene.addEventListener('touchstart', (e)=>{ drag=true; vX=0; vY=0; lX=e.touches.clientX; lY=e.touches.clientY; }, {passive:true});
        window.addEventListener('touchmove', (e)=>{ if(!drag)return; const dX=e.touches.clientX-lX, dY=e.touches.clientY-lY; vY=dX*0.35; vX=dY*0.35; cY+=vY; cX-=vX; lX=e.touches.clientX; lY=e.touches.clientY; }, {passive:true});
        window.addEventListener('touchend', ()=>{ drag=false; });

        function phys() {
            if(!drag){ vX*=0.975; vY*=0.975; cY+=vY; cX-=vX; }
            rX+=(cX-rX)*0.12; rY+=(cY-rY)*0.12;
            cube.style.transform=`rotateX(${rX}deg) rotateY(${rY}deg)`;
            requestAnimationFrame(phys);
        }
        phys();

        function color(f) {
            const s=parseInt(f.getAttribute('data-score')), n=f.getAttribute('data-name'), opp=document.getElementById(f.getAttribute('data-opp')), oName=opp.getAttribute('data-name');
            if(s>0){
                f.style.background=`rgba(0,122,255,${0.2+(s*0.07)})`; f.style.color=s>5?'#fff':'#1c1c1e'; f.style.borderColor='#0056b3'; f.innerText=n+" : +"+s; f.classList.remove('locked');
                const scoreInverse = -(20 - s);
                opp.classList.add('locked'); opp.innerText=oName+" : "+scoreInverse; opp.style.background=''; opp.style.color=''; opp.setAttribute('data-score','0');
            }else{
                f.style.background='rgba(255,255,255,0.9)'; f.style.color='#1c1c1e'; f.style.borderColor='#007aff'; f.innerText=n;
                opp.classList.remove('locked'); opp.style.background='rgba(255,255,255,0.9)'; opp.style.color='#1c1c1e'; opp.style.borderColor='#007aff'; opp.innerText=oName;
            }
        }

        faces.forEach(f => {
            f.addEventListener('click', ()=>{
                if(Math.abs(vX)>0.3 || Math.abs(vY)>0.3 || f.classList.contains('locked'))return;
                if(sel && sel!==f && !sel.classList.contains('locked')) color(sel);
                sel=f; if(parseInt(f.getAttribute('data-score'))===0) f.style.background='rgba(0,122,255,0.4)';
                widget.classList.add('visible'); wTitle.innerText=f.getAttribute('data-name')+" (+"+f.getAttribute('data-score')+")";
            });
        });

        window.addEventListener('wheel', (e)=>{
            if(sel && !sel.classList.contains('locked')){
                e.preventDefault();
                let s=parseInt(sel.getAttribute('data-score'));
                s = e.deltaY<0 ? Math.min(s+1,10) : Math.max(s-1,0);
                sel.setAttribute('data-score', s); color(sel);
                wTitle.innerText=sel.getAttribute('data-name')+" (+" + s + ")";
            }
        }, { passive: false });
    </script>
</body>
</html>
