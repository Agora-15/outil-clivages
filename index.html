<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora-15 | Modélisation 2 Faces</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; overflow: hidden; user-select: none;
        }
        header { text-align: center; position: absolute; top: 40px; }
        h1 { font-size: 26px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .sub { font-size: 14px; color: #8e8e93; margin-top: 5px; }
        
        /* Conteneur pour afficher le premier duo face à face */
        .duo-container {
            display: flex; gap: 30px; width: 90%; max-width: 500px;
            justify-content: center; align-items: center; margin-top: 20px;
        }
        
        /* Design des boîtes de clivages */
        .bloc-face {
            background: #ffffff; border: 2px solid #007aff;
            color: #1c1c1e; border-radius: 16px;
            width: 180px; height: 120px; display: flex; align-items: center;
            justify-content: center; text-align: center;
            font-size: 14px; font-weight: 600; padding: 15px;
            box-sizing: border-box; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.03);
        }
        .bloc-face:hover { background: rgba(0, 122, 255, 0.03); }
        
        /* Style des faces verrouillées en gris anthracite lisible */
        .bloc-face.verrouille {
            background: rgba(142, 142, 147, 0.18) !important;
            color: #3a3a3a !important;
            border-color: #8e8e93 !important;
            cursor: not-allowed !important;
            font-weight: 500;
        }
        
        #control-widget {
            position: absolute; bottom: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e5ea; padding: 15px 45px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center; min-width: 280px;
            opacity: 0; transform: translateY(15px);
            transition: all 0.4s ease; pointer-events: none;
        }
        #control-widget.visible { opacity: 1; transform: translateY(0); }
        .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; }
        .scroll-instruction { font-size: 12px; color: #007aff; font-weight: 500; margin-top: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>Agora-15</h1>
        <div class="sub">Sélectionnez un camp, puis utilisez la molette de votre souris.</div>
    </header>

    <!-- Affichage du premier duo d'opposés fondamentaux -->
    <div class="duo-container">
        <div class="bloc-face" id="f-glob" data-opp="f-souv" data-name="GLOBALISME" data-score="0">GLOBALISME</div>
        <div class="bloc-face" id="f-souv" data-opp="f-glob" data-name="SOUVERAINISME" data-score="0">SOUVERAINISME</div>
    </div>

    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>

    <script>
        const faces = document.querySelectorAll('.duo-container .bloc-face');
        const widget = document.getElementById('control-widget');
        const wTitle = document.getElementById('act-name');
        let sel = null;

        function rafraichirCouleurFace(f) {
            const score = parseInt(f.getAttribute('data-score'));
            const nomOrigine = f.getAttribute('data-name');
            const opp = document.getElementById(f.getAttribute('data-opp'));
            const nomOpposeOrigine = opp.getAttribute('data-name');
            
            if (score > 0) {
                // Coloration de la boîte active en bleu intense selon le score
                f.style.background = `rgba(0, 122, 255, ${0.15 + (score * 0.085)})`;
                f.style.color = score > 5 ? '#ffffff' : '#1c1c1e';
                f.style.borderColor = '#0056b3';
                f.innerText = nomOrigine + " : +" + score;
                f.classList.remove('verrouille');

                // Calcul et application stricte de la règle du miroir (-14) sur l'opposé
                const scoreInverse = -(20 - score);
                opp.classList.add('verrouille');
                opp.innerText = nomOpposeOrigine + " : " + scoreInverse;
                opp.style.background = ''; opp.style.color = '';
                opp.setAttribute('data-score', '0');
            } else {
                // Rétablissement de l'état par défaut (blanc) si le score revient à 0
                f.style.background = '#ffffff'; f.style.color = '#1c1c1e'; f.style.borderColor = '#007aff';
                f.innerText = nomOrigine;
                opp.classList.remove('verrouille');
                opp.style.background = '#ffffff'; opp.style.color = '#1c1c1e'; opp.style.borderColor = '#007aff';
                opp.innerText = nomOpposeOrigine;
            }
        }

        faces.forEach(f => {
            f.addEventListener('click', () => {
                if (f.classList.contains('verrouille')) return;
                
                if (sel && sel !== f && !sel.classList.contains('verrouille')) {
                    rafraichirCouleurFace(sel);
                }
                
                sel = f;
                if (parseInt(f.getAttribute('data-score')) === 0) {
                    f.style.background = 'rgba(0, 122, 255, 0.3)';
                }
                
                widget.classList.add('visible');
                wTitle.innerText = f.getAttribute('data-name') + " (+" + f.getAttribute('data-score') + ")";
            });
        });

        window.addEventListener('wheel', (e) => {
            if (sel && !sel.classList.contains('verrouille')) {
                e.preventDefault();
                let score = parseInt(sel.getAttribute('data-score'));
                score = e.deltaY < 0 ? Math.min(score + 1, 10) : Math.max(score - 1, 0);
                
                sel.setAttribute('data-score', score);
                rafraichirCouleurFace(sel);
                wTitle.innerText = sel.getAttribute('data-name') + " (+" + score + ")";
            }
        }, { passive: false });
    </script>
</body>
</html>
