<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Dodécaèdre Fixe</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; overflow: hidden; user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        .scene { width: 340px; height: 320px; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
        svg { width: 100%; height: 100%; }
        .face { fill: rgba(255,255,255,0.9); stroke: #007aff; stroke-width: 1.5; cursor: pointer; transition: all 0.2s; }
        .face:hover { fill: rgba(0,122,255,0.05); }
        .face.locked { fill: rgba(142,142,147,0.18)!important; stroke: #8e8e93!important; cursor: not-allowed!important; }
        .face-text { font-size: 8px; font-weight: bold; fill: #1c1c1e; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
        .face-text.locked { fill: #4a4a4a!important; font-weight: 500; }
        .face-text.active { fill: #ffffff!important; }
        #control-widget {
            position: absolute; bottom: 40px;
            background: rgba(255, 255, 255, 0.95); border: 1px solid #e5e5ea;
            padding: 15px 45px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center; min-width: 280px; opacity: 0; transform: translateY(20px);
            transition: all 0.4s; pointer-events: none;
        }
        #control-widget.visible { opacity: 1; transform: translateY(0); }
        .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; margin-bottom: 4px; }
        .scroll-instruction { font-size: 12px; color: #007aff; font-weight: 500; }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Étape 7 : Dodécaèdre Rhombique à plat. Cliquez sur un losange, molette pour noter.</p>
    <div class="scene">
        <svg viewBox="-160 -160 320 320"><g id="poly-group"></g></svg>
    </div>
    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>
    <script>
        const canvas = document.getElementById('poly-group');
        const widget = document.getElementById('control-widget');
        const wTitle = document.getElementById('act-name');
        let selIdx = null;

        const clivages = [
            { name: "GLOBALISME", opp: 1, score: 0, locked: false }, { name: "SOUVERAINISME", opp: 0, score: 0, locked: false },
            { name: "ÉGALITARISME", opp: 3, score: 0, locked: false }, { name: "MÉRITOCRATIE", opp: 2, score: 0, locked: false },
            { name: "TECHNOCRATIE", opp: 5, score: 0, locked: false }, { name: "POPULISME", opp: 4, score: 0, locked: false },
            { name: "FÉMINISME", opp: 7, score: 0, locked: false }, { name: "PATRIARCAT", opp: 6, score: 0, locked: false },
            { name: "ESSENTIALISME", opp: 9, score: 0, locked: false }, { name: "CONSTRUCTIVISME", opp: 8, score: 0, locked: false },
            { name: "ROYALISME", opp: 11, score: 0, locked: false }, { name: "RÉPUBLICANISME", opp: 10, score: 0, locked: false }
        ];

        // 12 Losanges parfaits dessinés en rosace (Toutes les coordonnées sont remplies à 100%)
        const facesGeo = [
            [[0,-35], [45,-60], [45,-110], [0,-85]],
            [[45,-60], [90,-35], [90,-85], [45,-110]],
            [[0,-35], [-45,-60], [-45,-110], [0,-85]],
            [[-45,-60], [-90,-35], [-90,-85], [-45,-110]],
            [[45,-60], [90,-35], [45,-10], [0,-35]],
            [[-45,-60], [-90,-35], [-45,-10], [0,-35]],
            [[90,-35], [90,15], [45,40], [45,-10]],
            [[-90,-35], [-90,15], [-45,40], [-45,-10]],
            [[0,-35], [45,-10], [45,40], [0,15]],
            [[0,-35], [-45,-10], [-45,40], [0,15]],
            [[45,-10], [45,40], [0,15], [0,-15]],
            [[-45,-10], [-45,40], [0,15], [0,-15]]
        ];

        function dessiner() {
            canvas.innerHTML = '';
            
            facesGeo.forEach((f, id) => {
                const data = clivages[id];
                const poly = document.createElementNS("http://w3.org", "polygon");
                
                // Tracé géométrique à l'échelle x1.5 pour occuper l'écran
                const pStr = f.map(p => `${p[0]*1.5},${p[1]*1.5}`).join(' ');
                poly.setAttribute("points", pStr);
                poly.setAttribute("class", "face" + (data.locked ? " locked" : ""));
                
                if (selIdx === id) poly.style.fill = "rgba(0,122,255,0.4)";
                else if (data.score > 0) poly.style.fill = `rgba(0, 122, 255, ${0.2 + (data.score * 0.07)})`;

                // Calcul mathématique des centres exacts des losanges pour le texte
                const cx = (f[0][0] + f[1][0] + f[2][0] + f[3][0]) / 4 * 1.5;
                const cy = (f[0][1] + f[1][1] + f[2][1] + f[3][1]) / 4 * 1.5;

                const txt = document.createElementNS("http://w3.org", "text");
                txt.setAttribute("x", cx); txt.setAttribute("y", cy);
                txt.setAttribute("class", "face-text" + (data.locked ? " locked" : "") + (data.score > 0 || selIdx === id ? " active" : ""));
                
                let label = data.name;
                if (data.locked) label += " : " + data.score;
                else if (data.score > 0) label += " : +" + data.score;
                txt.textContent = label;

                poly.addEventListener('click', () => {
                    if (data.locked) return;
                    selIdx = id;
                    widget.classList.add('visible');
                    wTitle.textContent = data.name + " (+" + data.score + ")";
                    dessiner();
                });

                canvas.appendChild(poly);
                canvas.appendChild(txt);
            });
        }
        
        dessiner();

        window.addEventListener('wheel', (e) => {
            if (selIdx !== null && !clivages[selIdx].locked) {
                e.preventDefault();
                let s = clivages[selIdx].score;
                s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0);
                
                clivages[selIdx].score = s;
                const oppIdx = clivages[selIdx].opp;
                
                if (s > 0) {
                    clivages[oppIdx].score = -(20 - s);
                    clivages[oppIdx].locked = true;
                } else {
                    clivages[oppIdx].score = 0;
                    clivages[oppIdx].locked = false;
                }
                
                wTitle.textContent = clivages[selIdx].name + " (+" + s + ")";
                dessiner();
            }
        }, { passive: false });
    </script>
</body>
</html>
