<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora-15 | Modélisation des Clivages</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        #info-overlay {
            margin-top: 30px;
            text-align: center;
            color: #1c1c1e;
        }

        h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        p {
            font-size: 14px;
            color: #8e8e93;
            margin: 0;
        }

        #graphic-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 55vh;
        }

        svg {
            width: 90%;
            height: 90%;
            max-width: 450px;
            max-height: 450px;
        }

        .facet {
            fill: #f2f2f7;
            stroke: #d1d1d6;
            stroke-width: 1.5;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .facet:hover {
            fill: #e5e5ea;
            stroke: #8e8e93;
        }

        .facet.selected {
            fill: #007aff !important;
            stroke: #0056b3;
        }

        #control-widget {
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e5e5ea;
            padding: 20px 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            min-width: 280px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .widget-title {
            font-size: 16px;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 5px;
        }

        .scroll-instruction {
            font-size: 12px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <div id="info-overlay">
        <h1>Agora-15</h1>
        <p>Explorez la structure et cliquez sur une facette pour interagir</p>
    </div>

    <div id="graphic-container">
        <svg id="rosace" viewBox="0 0 400 400">
            <g id="mesh-group"></g>
        </svg>
    </div>

    <div id="control-widget">
        <div class="widget-title" id="active-face-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette de votre souris pour ajuster (0 à 10)</div>
    </div>

    <script>
        const clivages = [
            "Républicanisme", "Royalisme", "Technocratie", "Populisme", 
            "Autoritarisme", "Libertarianisme", "Capitalisme", "Socialisme",
            "Égalitarisme", "Méritocratie", "Libéralisme", "Protectionnisme",
            "Féminisme", "Patriarcat", "Essentialisme", "Constructivisme",
            "Universalisme", "Communautarisme", "Progressisme", "Conservatisme",
            "Technosolutionnisme", "Radicalité écologique", "Écocentrisme", "Anthropocentrisme",
            "Globalisme", "Souverainisme", "Ouverture", "Fermeture",
            "Scientisme", "Relativisme scientifique"
        ];

        const meshGroup = document.getElementById('mesh-group');
        const widget = document.getElementById('control-widget');
        const faceNameText = document.getElementById('active-face-name');
        let activeElement = null;
        let scores = Array(30).fill(0);

        const cx = 200, cy = 200;
        const R1 = 150, R2 = 90, R3 = 45;

        for (let i = 0; i < 30; i++) {
            const angle1 = (i * (Math.PI * 2) / 30) - Math.PI/2;
            const angle2 = ((i + 1) * (Math.PI * 2) / 30) - Math.PI/2;

            const x1 = cx + R1 * Math.cos(angle1);
            const y1 = cy + R1 * Math.sin(angle1);
            const x2 = cx + R2 * Math.cos((angle1 + angle2) / 2);
            const y2 = cy + R2 * Math.sin((angle1 + angle2) / 2);
            const x3 = cx + R1 * Math.cos(angle2);
            const y3 = cy + R1 * Math.sin(angle2);
            const x4 = cx + R3 * Math.cos((angle1 + angle2) / 2);
            const y4 = cy + R3 * Math.sin((angle1 + angle2) / 2);

            const poly = document.createElementNS("http://w3.org", "polygon");
            poly.setAttribute("points", `${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}`);
            poly.setAttribute("class", "facet");
            poly.dataset.index = i;
            poly.dataset.name = clivages[i];

            poly.addEventListener('click', function(e) {
                if (activeElement) {
                    activeElement.classList.remove('selected');
                    const oldIdx = activeElement.dataset.index;
                    activeElement.style.fill = scores[oldIdx] > 0 ? '#007aff' : '';
                    activeElement.style.opacity = scores[oldIdx] > 0 ? 0.3 + (scores[oldIdx] * 0.07) : '';
                }

                activeElement = poly;
                poly.classList.add('selected');
                poly.style.opacity = 1;

                widget.style.opacity = 1;
                const idx = poly.dataset.index;
                faceNameText.innerText = poly.dataset.name + " : +" + scores[idx];
            });

            meshGroup.appendChild(poly);
        }

        window.addEventListener('wheel', function(e) {
            if (activeElement) {
                e.preventDefault();
                const idx = parseInt(activeElement.dataset.index);
                
                if (e.deltaY < 0) {
                    scores[idx] = Math.min(scores[idx] + 1, 10);
                } else {
                    scores[idx] = Math.max(scores[idx] - 1, 0);
                }

                faceNameText.innerText = activeElement.dataset.name + " : +" + scores[idx];
                activeElement.style.opacity = 0.4 + (scores[idx] * 0.06);
            }
        }, { passive: false });
    </script>
</body>
</html>
