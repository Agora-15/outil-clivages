<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | 30 Faces Stables</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; overflow:hidden; user-select:none; }
        h1 { position:absolute; top:30px; text-transform:uppercase; letter-spacing:2px; font-weight:300; }
        p { position:absolute; top:80px; color:#8e8e93; font-size:14px; text-align:center; padding:0 20px; }
        .scene { width:340px; height:340px; margin-top:20px; cursor:grab; display:flex; align-items:center; justify-content:center; }
        .scene:active { cursor:grabbing; }
        svg { width:100%; height:100%; }
        .face-node { fill:rgba(255,255,255,0.9); stroke:#007aff; stroke-width:1.5; cursor:pointer; transition:all 0.2s; }
        .face-node:hover { fill:rgba(0,122,255,0.08); stroke-width:2.5; }
        .face-node.locked { fill:rgba(142,142,147,0.18)!important; stroke:#8e8e93!important; cursor:not-allowed!important; }
        .face-text { font-size:7px; font-weight:bold; fill:#1c1c1e; pointer-events:none; text-anchor:middle; dominant-baseline:central; }
        .face-text.locked { fill:#4a4a4a!important; font-weight:500; }
        .face-text.active { fill:#ffffff!important; }
        #control-widget { position:absolute; bottom:40px; background:rgba(255,255,255,0.95); border:1px solid #e5e5ea; padding:15px 45px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.05); text-align:center; min-width:280px; opacity:0; transform:translateY(20px); transition:all 0.4s; pointer-events:none; }
        #control-widget.visible { opacity:1; transform:translateY(0); }
        .widget-title { font-size:15px; font-weight:600; color:#1c1c1e; margin-bottom:4px; }
        .scroll-instruction { font-size:12px; color:#007aff; font-weight:500; }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Modélisation Moléculaire : Étape 1 - Suppression des 2 pôles horizontaux.</p>
    <div class="scene" id="scene">
        <svg viewBox="-170 -160 340 340"><g id="poly-group"></g></svg>
    </div>
    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>
    <script>
        const canvas = document.getElementById('poly-group'), widget = document.getElementById('control-widget'), wTitle = document.getElementById('act-name');
        let drag = false, rX = -20, rY = 20, cX = -20, cY = 20, vX = 0, vY = 0, lX = 0, lY = 0, selIdx = null;

        const clivages = [
            { name: "GLOBALISME", opp: 1, score: 0, locked: false }, { name: "SOUVERAINISME", opp: 0, score: 0, locked: false },
            { name: "ÉGALITARISME", opp: 3, score: 0, locked: false }, { name: "MÉRITOCRATIE", opp: 2, score: 0, locked: false },
            { name: "TECHNOCRATIE", opp: 5, score: 0, locked: false }, { name: "POPULISME", opp: 4, score: 0, locked: false },
            { name: "FÉMINISME", opp: 7, score: 0, locked: false }, { name: "PATRIARCAT", opp: 6, score: 0, locked: false },
            { name: "ESSENTIALISME", opp: 9, score: 0, locked: false }, { name: "CONSTRUCTIVISME", opp: 8, score: 0, locked: false },
            { name: "ROYALISME", opp: 11, score: 0, locked: false }, { name: "RÉPUBLICANISME", opp: 10, score: 0, locked: false },
            { name: "LIBÉRALISME", opp: 13, score: 0, locked: false }, { name: "PROTECTIONNISME", opp: 12, score: 0, locked: false },
            { name: "UNIVERSALISME", opp: 15, score: 0, locked: false }, { name: "COMMUNAUTARISME", opp: 14, score: 0, locked: false },
            { name: "AUTORITARISME", opp: 17, score: 0, locked: false }, { name: "LIBERTARIANISME", opp: 16, score: 0, locked: false },
            { name: "PROGRESSISME", opp: 19, score: 0, locked: false }, { name: "CONSERVATISME", opp: 18, score: 0, locked: false },
            { name: "CAPITALISME", opp: 21, score: 0, locked: false }, { name: "SOCIALISME", opp: 20, score: 0, locked: false },
            { name: "TECHNOSOLUTIONNISME", opp: 23, score: 0, locked: false }, { name: "RADICALITÉ ÉCOLOGIQUE", opp: 22, score: 0, locked: false },
            { name: "ÉCOCENTRISME", opp: 25, score: 0, locked: false }, { name: "ANTHROPOCENTRISME", opp: 24, score: 0, locked: false },
            { name: "OUVERTURE", opp: 27, score: 0, locked: false }, { name: "FERMETURE", opp: 26, score: 0, locked: false },
            { name: "SCIENTISME", opp: 29, score: 0, locked: false }, { name: "RELATIVISME SCIENTIFIQUE", opp: 28, score: 0, locked: false }
        ];

        const g = 1.618, R = 120;
        const directions = [
            { x: R, y: 0, z: R/g }, { x: -R, y: 0, z: -R/g }, { x: R/g, y: R, z: 0 }, { x: -R/g, y: -R, z: 0 },
            { x: 0, y: R/g, z: R }, { x: 0, y: -R/g, z: -R }, { x: R, y: 0, z: -R/g }, { x: -R, y: 0, z: R/g },
            { x: R/g, y: -R, z: 0 }, { x: -R/g, y: R, z: 0 }, { x: 0, y: R/g, z: -R }, { x: 0, y: -R/g, z: R },
            { x: R/g, y: R/g, z: R/g }, { x: -R/g, y: -R/g, z: -R/g }, { x: R/g, y: R/g, z: -R/g }, { x: -R/g, y: -R/g, z: R/g },
            { x: R/g, y: -R/g, z: R/g }, { x: -R/g, y: R/g, z: -R/g }, { x: R/g, y: -R/g, z: -R/g }, { x: -R/g, y: R/g, z: R/g },
            // Correction : Les 2 axes verticaux polaires purs ont été supprimés. Reste les 8 cercles de la ceinture équatoriale.
            { x: R*Math.cos(0), y: 0, z: R*Math.sin(0) }, { x: R*Math.cos(Math.PI), y: 0, z: R*Math.sin(Math.PI) },
            { x: R*Math.cos(Math.PI/4), y: 0, z: R*Math.sin(Math.PI/4) }, { x: R*Math.cos(-3*Math.PI/4), y: 0, z: R*Math.sin(-3*Math.PI/4) },
            { x: R*Math.cos(-Math.PI/4), y: 0, z: R*Math.sin(-Math.PI/4) }, { x: R*Math.cos(3*Math.PI/4), y: 0, z: R*Math.sin(3*Math.PI/4) },
            { x: R*Math.cos(Math.PI/2), y: 0, z: R*Math.sin(Math.PI/2) }, { x: R*Math.cos(-Math.PI/2), y: 0, z: R*Math.sin(-Math.PI/2) }
        ];

        function projeter(pt) {
            const radX = rX * Math.PI / 180, radY = rY * Math.PI / 180;
            const cosX = Math.cos(radX), sinX = Math.sin(radX);
            const cosY = Math.cos(radY), sinY = Math.sin(radY);
            const y1 = pt.y * cosX - pt.z * sinX;
            const z1 = pt.y * sinX + pt.z * cosX;
            const x2 = pt.x * cosY + z1 * sinY;
            return { x: x2, y: y1, z: z1 };
        }

        function dessiner() {
            canvas.innerHTML = '';
            let listeDisques = [];

            directions.forEach((dir, index) => {
                let p = projeter(dir);
                listeDisques.push({ index: index, x: p.x, y: p.y, z: p.z });
            });

            listeDisques.sort((a, b) => a.z - b.z);

            listeDisques.forEach(d => {
                const data = clivages[d.index];
                const circle = document.createElementNS("http://w3.org", "circle");
                circle.setAttribute("cx", d.x); circle.setAttribute("cy", d.y);
                circle.setAttribute("r", "21");
                circle.setAttribute("class", "face-node" + (data.locked ? " locked" : ""));
                
                if (selIdx === d.index) circle.style.fill = "rgba(0,122,255,0.4)";
                else if (data.score > 0) circle.style.fill = `rgba(0, 122, 255, ${0.2 + (data.score * 0.07)})`;

                const txt = document.createElementNS("http://w3.org", "text");
                txt.setAttribute("x", d.x); txt.setAttribute("y", d.y);
                txt.setAttribute("class", "face-text" + (data.locked ? " locked" : "") + (data.score > 0 || selIdx === d.index ? " active" : ""));
                
                let lbl = data.name.substring(0, 8) + ".";
                if (data.locked) lbl = "Locked";
                else if (data.score > 0) lbl = "+" + data.score;
                txt.textContent = lbl;

                circle.addEventListener('click', () => {
                    if (data.locked) return;
                    selIdx = d.index;
                    widget.classList.add('visible');
                    wTitle.textContent = data.name + " (+" + data.score + ")";
                    dessiner();
                });

                canvas.appendChild(circle);
                canvas.appendChild(txt);
            });
        }

        document.getElementById('scene').addEventListener('mousedown', (e) => { drag = true; vX = 0; vY = 0; lX = e.clientX; lY = e.clientY; });
        window.addEventListener('mousemove', (e) => { if (!drag) return; vY = (e.clientX - lX) * 0.4; vX = (e.clientY - lY) * 0.4; cY += vY; cX -= vX; lX = e.clientX; lY = e.clientY; });
        window.addEventListener('mouseup', () => { drag = false; });

        function phys() {
            if (!drag) { vX *= 0.975; vY *= 0.975; cY += vY; cX -= vX; }
            rX += (cX - rX) * 0.12; rY += (cY - rY) * 0.12;
            dessiner();
            requestAnimationFrame(phys);
        }
        phys();

        window.addEventListener('wheel', (e) => {
            if (selIdx !== null && !clivages[selIdx].locked) {
                e.preventDefault();
                let s = clivages[selIdx].score;
                s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0);
                clivages[selIdx].score = s;

                const oppIdx = clivages[selIdx].opp;
                if (s > 0) {
                    clivages[oppIdx].score = -(20 - s);
                    clivages[oppIdx].locked = true;
                } else {
                    clivages[oppIdx].score = 0;
                    clivages[oppIdx].locked = false;
                }
                wTitle.textContent = clivages[selIdx].name + " (+" + s + ")";
                dessiner();
            }
        }, { passive: false });
    </script>
</body>
</html>
