<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Test Cube</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; overflow: hidden;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Conteneur 3D mécanique du navigateur */
        .scene { width: 200px; height: 200px; perspective: 600px; margin-top: 50px; }
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            animation: tourner 8s infinite linear; /* Le cube tourne tout seul */
        }
        .face {
            position: absolute; width: 200px; height: 200px;
            border: 2px solid #007aff;
            background: rgba(0, 122, 255, 0.1);
        }
        /* Positionnement géométrique des 6 faces du cube */
        .front  { transform: rotateY(  0deg) translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY( 90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX( 90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes tourner {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p style="position:absolute; top:80px; color:#8e8e93;">Test d'affichage 3D brute</p>

    <div class="scene">
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

</body>
</html>
