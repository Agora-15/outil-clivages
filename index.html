<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Cube des Clivages</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; }
        
        /* Structure de la scène 3D */
        .scene { width: 220px; height: 220px; perspective: 600px; margin-top: 50px; }
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            animation: tourner 12s infinite linear; /* Vitesse adaptée pour pouvoir lire */
        }
        
        /* Design des faces avec écriture centrée */
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.95);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 122, 255, 0.1);
            backface-visibility: visible; /* Permet de voir les écritures en transparence */
        }
        
        /* Positionnement des 6 faces dans l'espace */
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }

        @keyframes tourner {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Étape 2 : Visualisation des duos sur les faces opposées</p>

    <div class="scene">
        <div class="cube">
            <!-- Les 3 paires de clivages opposés -->
            <div class="face front">GLOBALISME</div>
            <div class="face back">SOUVERAINISME</div>
            
            <div class="face right">ÉGALITARISME</div>
            <div class="face left">MÉRITOCRATIE</div>
            
            <div class="face top">TECHNOCRATIE</div>
            <div class="face bottom">POPULISME</div>
        </div>
    </div>

</body>
</html>
