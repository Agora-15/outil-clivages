<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Cube avec Inertie</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        
        .scene { width: 220px; height: 220px; perspective: 600px; margin-top: 50px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            /* Suppression de la transition CSS pour laisser le script JavaScript gérer l'inertie de manière fluide */
        }
        
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 122, 255, 0.05);
            backface-visibility: visible;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        
        .face.active {
            background: rgba(0, 122, 255, 0.8) !important;
            color: #ffffff !important;
            border-color: #0056b3;
        }
        
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Étape 4 : Lancez le cube avec votre souris et observez l'effet d'inertie quand vous lâchez.</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="face front">GLOBALISME</div>
            <div class="face back">SOUVERAINISME</div>
            <div class="face right">ÉGALITARISME</div>
            <div class="face left">MÉRITOCRATIE</div>
            <div class="face top">TECHNOCRATIE</div>
            <div class="face bottom">POPULISME</div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');

        let estEnTrainDeGlisser = false;
        let rotationX = -20;
        let rotationY = 20;

        // Variables physiques pour calculer la vitesse et l'inertie
        let vitesseX = 0;
        let vitesseY = 0;
        let dernierX = 0;
        let dernierY = 0;
        const friction = 0.95; // Plus le chiffre est bas, plus le cube s'arrête vite (0.95 = glisse longue)

        function CommencerGlisser(e) {
            estEnTrainDeGlisser = true;
            // On stoppe l'inertie précédente dès qu'on retouche le cube
            vitesseX = 0;
            vitesseY = 0;
            
            dernierX = e.clientX || (e.touches && e.touches[0].clientX);
            dernierY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        function Glisser(e) {
            if (!estEnTrainDeGlisser) return;
            
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            // Calcul du déplacement depuis la dernière image
            const deltaX = x - dernierX;
            const deltaY = y - dernierY;

            // La vitesse dépend de la force de votre geste
            vitesseY = deltaX * 0.4;
            vitesseX = deltaY * 0.4;

            rotationY += vitesseY;
            rotationX -= vitesseX;

            cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

            dernierX = x;
            dernierY = y;
        }

        function ArreterGlisser() {
            estEnTrainDeGlisser = false;
        }

        // Événements Souris
        scene.addEventListener('mousedown', CommencerGlisser);
        window.addEventListener('mousemove', Glisser);
        window.addEventListener('mouseup', ArreterGlisser);

        // Événements Tactiles
        scene.addEventListener('touchstart', CommencerGlisser);
        window.addEventListener('touchmove', Glisser);
        window.addEventListener('touchend', ArreterGlisser);

        // --- BOUCLE DE RENDER PERMANENTE POUR L'INERTIE ---
        function mettreAJourPhysique() {
            // Si l'utilisateur ne touche plus le cube, la physique prend le relais
            if (!estEnTrainDeGlisser) {
                // Application de la friction pour ralentir les vitesses à chaque seconde
                vitesseX *= friction;
                vitesseY *= friction;

                // Si le mouvement devient minuscule, on l'arrête pour économiser l'écran
                if (Math.abs(vitesseX) < 0.01) vitesseX = 0;
                if (Math.abs(vitesseY) < 0.01) vitesseY = 0;

                // Le cube continue sa rotation selon sa vitesse restante
                rotationY += vitesseY;
                rotationX -= vitesseX;

                cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            }
            
            // Relance la fonction en continu de manière ultra-fluide (60 fois par seconde)
            requestAnimationFrame(mettreAJourPhysique);
        }
        
        // Lancement immédiat de la boucle physique
        mettreAJourPhysique();

        // --- GESTION DU CLIC SUR UNE FACE ---
        faces.forEach(face => {
            face.addEventListener('click', (e) => {
                // Si le cube bouge encore beaucoup, on refuse le clic pour ne pas perturber la rotation
                if (Math.abs(vitesseX) > 0.5 || Math.abs(vitesseY) > 0.5) return;
                
                faces.forEach(f => f.classList.remove('active'));
                face.classList.add('active');
            });
        });
    </script>
</body>
</html>
