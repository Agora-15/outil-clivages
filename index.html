<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Test 1 Face</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; overflow: hidden; user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; }
        .scene { width: 320px; height: 320px; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
        svg { width: 100%; height: 100%; }
        /* Style brute du losange de test */
        .test-face {
            fill: #007aff;
            stroke: #0056b3;
            stroke-width: 2;
            cursor: pointer;
        }
        .face-text {
            font-size: 12px;
            font-weight: bold;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Étape de diagnostic : test d'affichage d'une seule face brute</p>
    <div class="scene">
        <svg viewBox="-100 -100 200 200">

            <!-- Tracé vectoriel d'un losange parfait au centre -->
            <polygon points="0,-60 50,0 0,60 -50,0" class="test-face" />
            
            <!-- Texte au centre exact (0,0) -->
            <text x="0" y="0" class="face-text">GLOBALISME</text>
        </svg>
    </div>
</body>
</html>
