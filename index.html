<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Dodécaèdre 12 Faces</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; overflow:hidden; user-select:none; }
        h1 { position:absolute; top:30px; text-transform:uppercase; letter-spacing:2px; font-weight:300; }
        p { position:absolute; top:80px; color:#8e8e93; font-size:14px; text-align:center; padding:0 20px; }
        .scene { width:320px; height:320px; margin-top:20px; cursor:grab; display:flex; align-items:center; justify-content:center; }
        .scene:active { cursor:grabbing; }
        svg { width:100%; height:100%; }
        .face { fill:rgba(255,255,255,0.9); stroke:#007aff; stroke-width:2; cursor:pointer; transition:fill 0.2s, stroke 0.2s; }
        .face:hover { fill:rgba(0,122,255,0.05); }
        .face.locked { fill:rgba(142,142,147,0.18)!important; stroke:#8e8e93!important; cursor:not-allowed!important; }
        .face-text { font-size:11px; font-weight:bold; fill:#1c1c1e; pointer-events:none; text-anchor:middle; dominant-baseline:central; }
        .face-text.locked { fill:#4a4a4a!important; font-weight:500; }
        .face-text.active { fill:#ffffff!important; }
        #control-widget { position:absolute; bottom:40px; background:rgba(255,255,255,0.95); border:1px solid #e5e5ea; padding:15px 45px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.05); text-align:center; min-width:280px; opacity:0; transform:translateY(20px); transition:all 0.4s; pointer-events:none; }
        #control-widget.visible { opacity:1; transform:translateY(0); }
        .widget-title { font-size:16px; font-weight:600; color:#1c1c1e; margin-bottom:4px; }
        .scroll-instruction { font-size:12px; color:#007aff; font-weight:500; }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Étape 7 : Dodécaèdre Rhombique (12 faces). Faites glisser pour tourner, molette pour noter.</p>

    <div class="scene" id="scene">
        <svg id="canvas" viewBox="-160 -160 320 320">
            <g id="poly-group"></g>
        </svg>
    </div>

    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>

    <script>
        const canvas = document.getElementById('poly-group'), widget = document.getElementById('control-widget'), wTitle = document.getElementById('act-name');
        let drag = false, rX = -20, rY = 20, cX = -20, cY = 20, vX = 0, vY = 0, lX = 0, lY = 0, selIdx = null;

        // Base de données des 6 couples de clivages pour vêtir les 12 faces du solide
        const clivages = [
            { name: "GLOBALISME", opp: 1, score: 0, locked: false }, { name: "SOUVERAINISME", opp: 0, score: 0, locked: false },
            { name: "ÉGALITARISME", opp: 3, score: 0, locked: false }, { name: "MÉRITOCRATIE", opp: 2, score: 0, locked: false },
            { name: "TECHNOCRATIE", opp: 5, score: 0, locked: false }, { name: "POPULISME", opp: 4, score: 0, locked: false },
            { name: "FÉMINISME", opp: 7, score: 0, locked: false }, { name: "PATRIARCAT", opp: 6, score: 0, locked: false },
            { name: "ESSENTIALISME", opp: 9, score: 0, locked: false }, { name: "CONSTRUCTIVISME", opp: 8, score: 0, locked: false },
            { name: "ROYALISME", opp: 11, score: 0, locked: false }, { name: "RÉPUBLICANISME", opp: 10, score: 0, locked: false }
        ];

        // Mathématiques tridimensionnelles du Dodécaèdre Rhombique (14 sommets réels)
        const d = 100, h = d / Math.sqrt(2);
        const sommets = [
            [0,0,d], [0,0,-d], [d,0,0], [-d,0,0], [0,d,0], [0,-d,0],
            [h,h,h], [h,h,-h], [h,-h,h], [h,-h,-h], [-h,h,h], [-h,h,-h], [-h,-h,h], [-h,-h,-h]
        ];

        // Définition géométrique des 12 losanges par l'index de leurs sommets
        const facesIndex = [, [1,9,2,7], [0,10,3,12], [1,13,3,11], [4,6,0,10], [5,12,0,8],
, [5,9,1,13], [2,6,4,7], [2,8,5,9], [3,11,4,10], [3,13,5,12]
        ];

        // Matrice de projection 3D vers 2D
        function projeter(x, y, z) {
            const radX = rX * Math.PI / 180, radY = rY * Math.PI / 180;
            const cosX = Math.cos(radX), sinX = Math.sin(radX);
            const cosY = Math.cos(radY), sinY = Math.sin(radY);
            const y1 = y * cosX - z * sinX;
            const z1 = y * sinX + z * cosX;
            const x2 = x * cosY + z1 * sinY;
            return { x: x2, y: y1, z: z1 };
        }

        // Rendu permanent et gestion de la profondeur (Z-ordering)
        function dessiner() {
            canvas.innerHTML = '';
            let listeFaces = [];

            facesIndex.forEach((fIdx, index) => {
                let pts = fIdx.map(i => projeter(...sommets[i]));
                // Centre de gravité Z de la face pour calculer la visibilité
                let zMoy = (pts[0].z + pts[1].z + pts[2].z + pts[3].z) / 4;
                listeFaces.push({ index: index, pts: pts, zMoy: zMoy });
            });

            // Tri pour afficher les faces arrières en premier
            listeFaces.sort((a, b) => a.zMoy - b.zMoy);

            listeFaces.forEach(f => {
                const data = clivages[f.index];
                const poly = document.createElementNS("http://w3.org", "polygon");
                let pStr = f.pts.map(p => `${p.x},${p.y}`).join(' ');
                poly.setAttribute("points", pStr);
                poly.setAttribute("class", "face" + (data.locked ? " locked" : ""));
                
                if(selIdx === f.index) poly.style.fill = "rgba(0,122,255,0.4)";
                else if(data.score > 0) poly.style.fill = `rgba(0, 122, 255, ${0.2 + (data.score * 0.07)})`;

                // Centre de la face pour positionner le texte au milieu du losange
                let cx = (f.pts[0].x + f.pts[1].x + f.pts[2].x + f.pts[3].x) / 4;
                let cy = (f.pts[0].y + f.pts[1].y + f.pts[2].y + f.pts[3].y) / 4;

                const txt = document.createElementNS("http://w3.org", "text");
                txt.setAttribute("x", cx); txt.setAttribute("y", cy);
                txt.setAttribute("class", "face-text" + (data.locked ? " locked" : "") + (data.score > 0 || selIdx === f.index ? " active" : ""));
                
                let label = data.name;
                if(data.locked) label += " : " + data.score;
                else if(data.score > 0) label += " : +" + data.score;
                txt.textContent = label;

                poly.addEventListener('click', () => {
                    if (data.locked) return;
                    selIdx = f.index;
                    widget.classList.add('visible');
                    wTitle.innerText = data.name + " (+" + data.score + ")";
                    dessiner();
                });

                canvas.appendChild(poly);
                canvas.appendChild(txt);
            });
        }

        // --- INTERACTION ROTATION SOURIS/TACTILE ---
        document.getElementById('scene').addEventListener('mousedown', (e) => { drag = true; vX = 0; vY = 0; lX = e.clientX; lY = e.clientY; });
        window.addEventListener('mousemove', (e) => { if (!drag) return; vY = (e.clientX - lX) * 0.4; vX = (e.clientY - lY) * 0.4; cY += vY; cX -= vX; lX = e.clientX; lY = e.clientY; });
        window.addEventListener('mouseup', () => { drag = false; });
        document.getElementById('scene').addEventListener('touchstart', (e) => { drag = true; vX = 0; vY = 0; lX = e.touches.clientX; lY = e.touches.clientY; }, { passive: true });
        window.addEventListener('touchmove', (e) => { if (!drag) return; vY = (e.touches.clientX - lX) * 0.4; vX = (e.touches.clientY - lY) * 0.4; cY += vY; cX -= vX; lX = e.touches.clientX; lY = e.touches.clientY; }, { passive: true });
        window.addEventListener('touchend', () => { drag = false; });

        function phys() {
            if (!drag) { vX *= 0.975; vY *= 0.975; cY += vY; cX -= vX; }
            rX += (cX - rX) * 0.12; rY += (cY - rY) * 0.12;
            dessiner();
            requestAnimationFrame(phys);
        }
        phys();

        // --- GESTION DE LA MOLETTE ET REGLE DU MIROIR (-14) ---
        window.addEventListener('wheel', (e) => {
            if (selIdx !== null && !clivages[selIdx].locked) {
                e.preventDefault();
                let s = clivages[selIdx].score;
                s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0);
                clivages[selIdx].score = s;

                const oppIdx = clivages[selIdx].opp;
                if (s > 0) {
                    clivages[oppIdx].score = -(20 - s);
                    clivages[oppIdx].locked = true;
                } else {
                    clivages[oppIdx].score = 0;
                    clivages[oppIdx].locked = false;
                }
                wTitle.innerText = clivages[selIdx].name + " (+" + s + ")";
                dessiner();
            }
        }, { passive: false });
    </script>
</body>
</html>
