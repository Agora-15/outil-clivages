<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Dodécaèdre</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; overflow:hidden; user-select:none; }
        h1 { position:absolute; top:30px; text-transform:uppercase; letter-spacing:2px; font-weight:300; }
        p { position:absolute; top:80px; color:#8e8e93; font-size:14px; text-align:center; }
        .scene { width:320px; height:320px; margin-top:20px; cursor:grab; }
        .scene:active { cursor:grabbing; }
        svg { width:100%; height:100%; }
        .face { fill:rgba(255,255,255,0.9); stroke:#007aff; stroke-width:2; cursor:pointer; transition:all 0.2s; }
        .face:hover { fill:rgba(0,122,255,0.05); }
        .face.locked { fill:rgba(142,142,147,0.18)!important; stroke:#8e8e93!important; cursor:not-allowed!important; }
        .face-text { font-size:10px; font-weight:bold; fill:#1c1c1e; pointer-events:none; text-anchor:middle; dominant-baseline:central; }
        .face-text.locked { fill:#4a4a4a!important; font-weight:500; }
        .face-text.active { fill:#ffffff!important; }
        #control-widget { position:absolute; bottom:40px; background:rgba(255,255,255,0.95); border:1px solid #e5e5ea; padding:15px 45px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.05); text-align:center; min-width:280px; opacity:0; transform:translateY(20px); transition:all 0.4s; pointer-events:none; }
        #control-widget.visible { opacity:1; transform:translateY(0); }
        .widget-title { font-size:16px; font-weight:600; color:#1c1c1e; }
        .scroll-instruction { font-size:12px; color:#007aff; font-weight:500; }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Étape 7 : Dodécaèdre Rhombique à 12 faces complet à la souris.</p>
    <div class="scene" id="scene"><svg viewBox="-160 -160 320 320"><g id="poly-group"></g></svg></div>
    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>
    <script>
        const canvas = document.getElementById('poly-group'), widget = document.getElementById('control-widget'), wTitle = document.getElementById('act-name');
        let drag = false, rX = -20, rY = 20, cX = -20, cY = 20, vX = 0, vY = 0, lX = 0, lY = 0, selIdx = null;
        const clivages = [
            { name: "GLOBALISME", opp: 1, score: 0, locked: false }, { name: "SOUVERAINISME", opp: 0, score: 0, locked: false },
            { name: "ÉGALITARISME", opp: 3, score: 0, locked: false }, { name: "MÉRITOCRATIE", opp: 2, score: 0, locked: false },
            { name: "TECHNOCRATIE", opp: 5, score: 0, locked: false }, { name: "POPULISME", opp: 4, score: 0, locked: false },
            { name: "FÉMINISME", opp: 7, score: 0, locked: false }, { name: "PATRIARCAT", opp: 6, score: 0, locked: false },
            { name: "ESSENTIALISME", opp: 9, score: 0, locked: false }, { name: "CONSTRUCTIVISME", opp: 8, score: 0, locked: false },
            { name: "ROYALISME", opp: 11, score: 0, locked: false }, { name: "RÉPUBLICANISME", opp: 10, score: 0, locked: false }
        ];
        const v0={x:0,y:0,z:100}, v1={x:0,y:0,z:-100}, v2={x:100,y:0,z:0}, v3={x:-100,y:0,z:0}, v4={x:0,y:100,z:0}, v5={x:0,y:-100,z:0}, v6={x:70.7,y:70.7,z:70.7}, v7={x:70.7,y:70.7,z:-70.7}, v8={x:70.7,y:-70.7,z:70.7}, v9={x:70.7,y:-70.7,z:-70.7}, v10={x:-70.7,y:70.7,z:70.7}, v11={x:-70.7,y:70.7,z:-70.7}, v12={x:-70.7,y:-70.7,z:70.7}, v13={x:-70.7,y:-70.7,z:-70.7};
        
        function transformer(p) {
            const rX=rX*Math.PI/180, rY=rY*Math.PI/180, cX=Math.cos(rX), sX=Math.sin(rX), cY=Math.cos(rY), sY=Math.sin(rY);
            const y1=p.y*cX-p.z*sX, z1=p.y*sX+p.z*cX, x2=p.x*cY+z1*sY;
            return { x: x2, y: y1, z: z1 };
        }
        function dessiner() {
            canvas.innerHTML = '';
            const p0=transformer(v0), p1=transformer(v1), p2=transformer(v2), p3=transformer(v3), p4=transformer(v4), p5=transformer(v5), p6=transformer(v6), p7=transformer(v7), p8=transformer(v8), p9=transformer(v9), p10=transformer(v10), p11=transformer(v11), p12=transformer(v12), p13=transformer(v13);
            const faces = [
                { id: 0, pts: [p0, p6, p2, p8] }, { id: 1, pts: [p1, p7, p2, p9] }, { id: 2, pts: [p0, p10, p3, p12] }, { id: 3, pts: [p1, p11, p3, p13] },
                { id: 4, pts: [p0, p6, p4, p10] }, { id: 5, pts: [p1, p7, p4, p11] }, { id: 6, pts: [p0, p8, p5, p12] }, { id: 7, pts: [p1, p9, p5, p13] },
                { id: 8, pts: [p2, p6, p4, p7] }, { id: 9, pts: [p2, p8, p5, p9] }, { id: 10, pts: [p3, p10, p4, p11] }, { id: 11, pts: [p3, p12, p5, p13] }
            ];
            faces.forEach(f => f.zMoy = (f.pts.z + f.pts.z + f.pts.z + f.pts.z) / 4);
            faces.sort((a, b) => a.zMoy - b.zMoy);
            faces.forEach(f => {
                const data = clivages[f.id], poly = document.createElementNS("http://w3.org", "polygon"), pStr = f.pts.map(p => `${p.x},${p.y}`).join(' ');
                poly.setAttribute("points", pStr); poly.setAttribute("class", "face" + (data.locked ? " locked" : ""));
                if(selIdx === f.id) poly.style.fill = "rgba(0,122,255,0.4)";
                else if(data.score > 0) poly.style.fill = `rgba(0, 122, 255, ${0.2 + (data.score * 0.07)})`;
                const cx = (f.pts.x + f.pts.x + f.pts.x + f.pts.x) / 4, cy = (f.pts.y + f.pts.y + f.pts.y + f.pts.y) / 4;
                const txt = document.createElementNS("http://w3.org", "text");
                txt.setAttribute("x", cx); txt.setAttribute("y", cy); txt.setAttribute("class", "face-text" + (data.locked ? " locked" : "") + (data.score > 0 || selIdx === f.id ? " active" : ""));
                let lbl = data.name;
                if(data.locked) lbl += " : " + data.score; else if(data.score > 0) lbl += " : +" + data.score;
                txt.textContent = lbl;
                poly.addEventListener('click', () => { if (data.locked) return; selIdx = f.id; widget.classList.add('visible'); wTitle.textContent = data.name + " (+" + data.score + ")"; dessiner(); });
                canvas.appendChild(poly); canvas.appendChild(txt);
            });
        }
        document.getElementById('scene').addEventListener('mousedown', (e) => { drag = true; vX = 0; vY = 0; lX = e.clientX; lY = e.clientY; });
        window.addEventListener('mousemove', (e) => { if (!drag) return; vY = (e.clientX - lX) * 0.4; vX = (e.clientY - lY) * 0.4; cY += vY; cX -= vX; lX = e.clientX; lY = e.clientY; });
        window.addEventListener('mouseup', () => { drag = false; });
        function phys() {
            if (!drag) { vX *= 0.975; vY *= 0.975; cY += vY; cX -= vX; }
            rX += (cX - rX) * 0.12; rY += (cY - rY) * 0.12; dessiner(); requestAnimationFrame(phys);
        }
        phys();
        window.addEventListener('wheel', (e) => {
            if (selIdx !== null && !clivages[selIdx].locked) {
                e.preventDefault(); let s = clivages[selIdx].score;
                s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0); clivages[selIdx].score = s;
                const oppIdx = clivages[selIdx].opp;
                if (s > 0) { clivages[oppIdx].score = -(20 - s); clivages[oppIdx].locked = true; } 
                else { clivages[oppIdx].score = 0; clivages[oppIdx].locked = false; }
                wTitle.textContent = clivages[selIdx].name + " (+" + s + ")"; dessiner();
            }
        }, { passive: false });
    </script>
</body>
</html>
