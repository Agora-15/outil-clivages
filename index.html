<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Miroir et Verrouillage</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        
        .scene { width: 220px; height: 220px; perspective: 600px; margin-top: 20px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            will-change: transform;
        }
        
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 122, 255, 0.05);
            backface-visibility: visible;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .face.locked {
            background: rgba(142, 142, 147, 0.15) !important;
            color: #aeaea3 !important;
            border-color: #d1d1d6 !important;
            cursor: not-allowed !important;
        }
        
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }

        #control-widget {
            position: absolute;
            bottom: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e5ea;
            padding: 15px 45px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            min-width: 280px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #control-widget.visible { opacity: 1; transform: translateY(0); }
        .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; margin-bottom: 4px; }
        .scroll-instruction { font-size: 12px; color: #007aff; font-weight: 500; }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Étape 6 : Renseignez un clivage. Son opposé affichera la valeur miroir et sera verrouillé.</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="face front" id="face-globalisme" data-opposable="face-souverainisme" data-name="GLOBALISME" data-score="0">GLOBALISME</div>
            <div class="face back" id="face-souverainisme" data-opposable="face-globalisme" data-name="SOUVERAINISME" data-score="0">SOUVERAINISME</div>
            
            <div class="face right" id="face-egalitarisme" data-opposable="face-meritocratie" data-name="ÉGALITARISME" data-score="0">ÉGALITARISME</div>
            <div class="face left" id="face-meritocratie" data-opposable="face-egalitarisme" data-name="MÉRITOCRATIE" data-score="0">MÉRITOCRATIE</div>
            
            <div class="face top" id="face-technocratie" data-opposable="face-populisme" data-name="TECHNOCRATIE" data-score="0">TECHNOCRATIE</div>
            <div class="face bottom" id="face-populisme" data-opposable="face-technocratie" data-name="POPULISME" data-score="0">POPULISME</div>
        </div>
    </div>

    <div id="control-widget">
        <div class="widget-title" id="active-face-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster de 0 à +10</div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');
        const widget = document.getElementById('control-widget');
        const widgetTitle = document.getElementById('active-face-name');

        let estEnTrainDeGlisser = false;
        let cibleX = -20; let cibleY = 20;
        let rotationX = -20; let rotationY = 20;
        let vitesseX = 0; let vitesseY = 0;
        let dernierX = 0; let dernierY = 0;
        const friction = 0.975;
        const sensibilite = 0.35;

        let faceSelectionnee = null;

        function CommencerGlisser(e) {
            estEnTrainDeGlisser = true;
            vitesseX = 0; vitesseY = 0;
            dernierX = e.clientX || (e.touches && e.touches.clientX);
            dernierY = e.clientY || (e.touches && e.touches.clientY);
        }

        function Glisser(e) {
            if (!estEnTrainDeGlisser) return;
            const x = e.clientX || (e.touches && e.touches.clientX);
            const y = e.clientY || (e.touches && e.touches.clientY);
            const deltaX = x - dernierX; const deltaY = y - dernierY;
            vitesseY = deltaX * sensibilite; vitesseX = deltaY * sensibilite;
            cibleY += vitesseY; cibleX -= vitesseX;
            dernierX = x; dernierY = y;
        }

        function ArreterGlisser() { estEnTrainDeGlisser = false; }

        scene.addEventListener('mousedown', CommencerGlisser);
        window.addEventListener('mousemove', Glisser);
        window.addEventListener('mouseup', ArreterGlisser);
        scene.addEventListener('touchstart', CommencerGlisser, { passive: true });
        window.addEventListener('touchmove', Glisser, { passive: true });
        window.addEventListener('touchend', ArreterGlisser);

        function bouclePhysique() {
            if (!estEnTrainDeGlisser) {
                vitesseX *= friction; vitesseY *= friction;
                cibleY += vitesseY; cibleX -= vitesseX;
            }
            rotationX += (cibleX - rotationX) * 0.12;
            rotationY += (cibleY - rotationY) * 0.12;
            cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            requestAnimationFrame(bouclePhysique);
        }
        bouclePhysique();

        function rafraichirCouleurFace(face) {
            const score = parseInt(face.getAttribute('data-score'));
            const nomOrigine = face.getAttribute('data-name');
            const idOppose = face.getAttribute('data-opposable');
            const faceOpposee = document.getElementById(idOppose);
            const nomOpposeOrigine = faceOpposee.getAttribute('data-name');
            
            if (score > 0) {
                face.style.background = `rgba(0, 122, 255, ${0.2 + (score * 0.07)})`;
                face.style.color = score > 5 ? '#ffffff' : '#1c1c1e';
                face.style.borderColor = '#0056b3';
                face.innerText = nomOrigine + " : +" + score;
                face.classList.remove('locked');

                const scoreMiroir = -(20 - score); 
                faceOpposee.classList.add('locked');
                faceOpposee.innerText = nomOpposeOrigine + " : " + scoreMiroir;
                faceOpposee.style.background = ''; 
                faceOpposee.style.color = '';
                faceOpposee.setAttribute('data-score', '0'); 
            } else {
                face.style.background = 'rgba(255, 255, 255, 0.9)';
                face.style.color = '#1c1c1e';
                face.style.borderColor = '#007aff';
                face.innerText = nomOrigine;

                faceOpposee.classList.remove('locked');
                faceOpposee.style.background = 'rgba(255, 255, 255, 0.9)';
                faceOpposee.style.color = '#1c1c1e';
                faceOpposee.style.borderColor = '#007aff';
                faceOpposee.innerText = nomOpposeOrigine;
            }
        }

        faces.forEach(face => {
            face.addEventListener('click', (e) => {
                if (Math.abs(vitesseX) > 0.3 || Math.abs(vitesseY) > 0.3) return;
                if (face.classList.contains('locked')) return;
                
                if (faceSelectionnee && faceSelectionnee !== face && !faceSelectionnee.classList.contains('locked')) {
                    rafraichirCouleurFace(faceSelectionnee);
                }

                faceSelectionnee = face;
                
                if (parseInt(face.getAttribute('data-score')) === 0) {
                    face.style.background = 'rgba(0, 122, 255, 0.4)';
                }
                
                widget.classList.add('visible');
                const nomOrigine = face.getAttribute('data-name');
                const scoreActuel = face.getAttribute('data-score');
                widgetTitle.innerText = nomOrigine + " (+" + scoreActuel + ")";
            });
        });

        window.addEventListener('wheel', (e) => {
            if (faceSelectionnee && !faceSelectionnee.classList.contains('locked')) {
                let score = parseInt(faceSelectionnee.getAttribute('data-score'));
                
                if (e.deltaY < 0) {
                    score = Math.min(score + 1, 10);
                } else {
                    score = Math.max(score - 1, 0);
                }
                faceSelectionnee.setAttribute('data-score', score);
rafraichirCouleurFace(faceSelectionnee);

const nomOrigine = faceSelectionnee.getAttribute('data-name');
widgetTitle.innerText = nomOrigine + " (+" + score + ")";
