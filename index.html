<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Cube Interactif</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        
        /* Conteneur 3D réactif à la souris */
        .scene { width: 220px; height: 220px; perspective: 600px; margin-top: 50px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg); /* Position de départ fixe */
            transition: transform 0.1s ease-out;
        }
        
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 122, 255, 0.05);
            backface-visibility: visible;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        
        /* Face sélectionnée par le clic */
        .face.active {
            background: rgba(0, 122, 255, 0.8) !important;
            color: #ffffff !important;
            border-color: #0056b3;
        }
        
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Étape 3 : Maintenez le clic enfoncé pour tourner le cube. Cliquez sur une face pour l'activer.</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="face front">GLOBALISME</div>
            <div class="face back">SOUVERAINISME</div>
            <div class="face right">ÉGALITARISME</div>
            <div class="face left">MÉRITOCRATIE</div>
            <div class="face top">TECHNOCRATIE</div>
            <div class="face bottom">POPULISME</div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');

        let estEnTrainDeGlisser = false;
        let precedentX = 0;
        let precedentY = 0;
        let rotationX = -20;
        let rotationY = 20;

        // --- GESTION DE LA ROTATION SOURIS/TACTILE ---
        function CommencerGlisser(e) {
            estEnTrainDeGlisser = true;
            precedentX = e.clientX || e.touches[0].clientX;
            precedentY = e.clientY || e.touches[0].clientY;
        }

        function Glisser(e) {
            if (!estEnTrainDeGlisser) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            
            const deltaX = x - precedentX;
            const deltaY = y - precedentY;

            rotationY += deltaX * 0.5;
            rotationX -= deltaY * 0.5;

            cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

            precedentX = x;
            precedentY = y;
        }

        function ArreterGlisser() {
            estEnTrainDeGlisser = false;
        }

        // Événements Souris
        scene.addEventListener('mousedown', CommencerGlisser);
        window.addEventListener('mousemove', Glisser);
        window.addEventListener('mouseup', ArreterGlisser);

        // Événements Écran Tactile (Mobile)
        scene.addEventListener('touchstart', CommencerGlisser);
        window.addEventListener('touchmove', Glisser);
        window.addEventListener('touchend', ArreterGlisser);

        // --- GESTION DU CLIC SUR UNE FACE ---
        faces.forEach(face => {
            face.addEventListener('click', (e) => {
                // Si on était en train de faire tourner le cube, on ignore le clic
                if (estEnTrainDeGlisser) return;
                
                // Désactiver la face précédente
                faces.forEach(f => f.classList.remove('active'));
                
                // Activer la face cliquée
                face.classList.add('active');
            });
        });
    </script>
</body>
</html>
