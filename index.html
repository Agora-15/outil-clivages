<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Intensité Molette</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        
        .scene { width: 220px; height: 220px; perspective: 600px; margin-top: 20px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            will-change: transform;
        }
        
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 122, 255, 0.05);
            backface-visibility: visible;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        
        /* Positionnement des faces */
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }

        /* Style élégant pour la fenêtre d'intensité en bas */
        #control-widget {
            position: absolute;
            bottom: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e5ea;
            padding: 15px 45px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            min-width: 280px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #control-widget.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .widget-title {
            font-size: 16px;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 4px;
        }

        .scroll-instruction {
            font-size: 12px;
            color: #007aff;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Étape 5 : Cliquez sur un clivage, puis utilisez la molette de votre souris pour ajuster sa force.</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <!-- Chaque face stocke son propre score par défaut à 0 -->
            <div class="face front" data-score="0">GLOBALISME</div>
            <div class="face back" data-score="0">SOUVERAINISME</div>
            <div class="face right" data-score="0">ÉGALITARISME</div>
            <div class="face left" data-score="0">MÉRITOCRATIE</div>
            <div class="face top" data-score="0">TECHNOCRATIE</div>
            <div class="face bottom" data-score="0">POPULISME</div>
        </div>
    </div>

    <!-- Le Widget du bas -->
    <div id="control-widget">
        <div class="widget-title" id="active-face-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster de 0 à +10</div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');
        const widget = document.getElementById('control-widget');
        const widgetTitle = document.getElementById('active-face-name');

        let estEnTrainDeGlisser = false;
        let cibleX = -20; let cibleY = 20;
        let rotationX = -20; let rotationY = 20;
        let vitesseX = 0; let vitesseY = 0;
        let dernierX = 0; let dernierY = 0;
        const friction = 0.975;
        const sensibilite = 0.35;

        let faceSelectionnee = null;

        function CommencerGlisser(e) {
            estEnTrainDeGlisser = true;
            vitesseX = 0; vitesseY = 0;
            dernierX = e.clientX || (e.touches && e.touches.clientX);
            dernierY = e.clientY || (e.touches && e.touches.clientY);
        }

        function Glisser(e) {
            if (!estEnTrainDeGlisser) return;
            const x = e.clientX || (e.touches && e.touches.clientX);
            const y = e.clientY || (e.touches && e.touches.clientY);
            const deltaX = x - dernierX;
            const deltaY = y - dernierY;

            vitesseY = deltaX * sensibilite;
            vitesseX = deltaY * sensibilite;
            cibleY += vitesseY;
            cibleX -= vitesseX;

            dernierX = x; dernierY = y;
        }

        function ArreterGlisser() { estEnTrainDeGlisser = false; }

        scene.addEventListener('mousedown', CommencerGlisser);
        window.addEventListener('mousemove', Glisser);
        window.addEventListener('mouseup', ArreterGlisser);
        scene.addEventListener('touchstart', CommencerGlisser, { passive: true });
        window.addEventListener('touchmove', Glisser, { passive: true });
        window.addEventListener('touchend', ArreterGlisser);

        function bouclePhysique() {
            if (!estEnTrainDeGlisser) {
                vitesseX *= friction; vitesseY *= friction;
                cibleY += vitesseY; cibleX -= vitesseX;
            }
            rotationX += (cibleX - rotationX) * 0.12;
            rotationY += (cibleY - rotationY) * 0.12;
            cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            requestAnimationFrame(bouclePhysique);
        }
        bouclePhysique();

        // --- APPLIQUER LA COULEUR SELON LE SCORE ---
        function rafraichirCouleurFace(face) {
            const score = parseInt(face.getAttribute('data-score'));
            const texteOrigine = face.innerText.split(" :")[0];
            
            if (score > 0) {
                // Plus le score est élevé, plus le fond bleu devient opaque et le texte blanc
                face.style.background = `rgba(0, 122, 255, ${0.2 + (score * 0.07)})`;
                face.style.color = score > 5 ? '#ffffff' : '#1c1c1e';
                face.style.borderColor = '#0056b3';
                face.innerText = `${texteOrigine} : +${score}`;
            } else {
                // Remise à zéro si le score vaut 0
                face.style.background = 'rgba(255, 255, 255, 0.9)';
                face.style.color = '#1c1c1e';
                face.style.borderColor = '#007aff';
                face.innerText = texteOrigine;
            }
        }

        // --- CLIC FACE ---
        faces.forEach(face => {
            face.addEventListener('click', (e) => {
                if (Math.abs(vitesseX) > 0.3 || Math.abs(vitesseY) > 0.3) return;
                
                // Réinitialiser visuellement la face précédente si elle n'a pas de points
                if (faceSelectionnee && faceSelectionnee !== face) {
                    rafraichirCouleurFace(faceSelectionnee);
                }

                faceSelectionnee = face;
                
                // Mettre en surbrillance immédiate la face active
                face.style.background = 'rgba(0, 122, 255, 0.4)';
                
                // Activer le widget textuel du bas
                widget.classList.add('visible');
                const texteNettoye = face.innerText.split(" :")[0];
                const scoreActuel = face.getAttribute('data-score');
                widgetTitle.innerText = `${texteNettoye} (+${scoreActuel})`;
            });
        });

        // --- CAPTURE DE LA MOLETTE POUR LA NOTATION ---
        window.addEventListener('wheel', (e) => {
            if (faceSelectionnee) {
                // On récupère le score actuel de la face
                let score = parseInt(faceSelectionnee.getAttribute('data-score'));
                
                // Détection du sens de la molette
                if (e.deltaY < 0) {
                    score = Math.min(score + 1, 10); // Augmenter jusqu'à 10 max
                } else {
                    score = Math.max(score - 1, 0);  // Diminuer jusqu'à 0 min
                }
                
                // Sauvegarde du score dans la face
                faceSelectionnee.setAttribute('data-score', score);
                
                // Mise à jour visuelle immédiate
                rafraichirCouleurFace(faceSelectionnee);
                
                const texteNettoye = faceSelectionnee.innerText.split(" :")[0];
                widgetTitle.innerText = `${texteNettoye} (+${score})`;
            }
        });
    </script>
</body>
</html>
