<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Perspective Centrée</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: sans-serif; overflow: hidden; user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; }
        
        /* 1. PERSPECTIVE CONIQUE CENTRALE RIGOUREUSE */
        .scene {
            width: 220px; height: 220px;
            perspective: 800px;
            perspective-origin: 50% 50%;
            margin-top: 20px; cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        
        /* 2. AXE DE ROTATION PARFAITEMENT CENTRÉ */
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            transform-origin: 50% 50% 0px;
        }
        
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            backface-visibility: visible; cursor: pointer;
            transition: all 0.2s;
            transform-origin: 50% 50% 0px;
        }
        
        .face.locked {
            background: rgba(142, 142, 147, 0.18) !important;
            color: #4a4a4a !important;
            border-color: #8e8e93 !important;
            cursor: not-allowed !important;
            font-weight: 500;
        }
        
        /* Positionnement spatial strict par rapport au centre (0,0,0) */
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }
        
        #control-widget {
            position: absolute; bottom: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e5ea; padding: 15px 45px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center; min-width: 280px;
            opacity: 0; transform: translateY(20px);
            transition: all 0.4s; pointer-events: none;
        }
        #control-widget.visible { opacity: 1; transform: translateY(0); }
        .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; margin-bottom: 4px; }
        .scroll-instruction { font-size: 12px; color: #007aff; font-weight: 500; }
    </style>
</head>
<body>
    <h1>Agora-15</h1>
    <p>Étape 6.3 : Rétablissement de la perspective conique centrale et des scores.</p>
    
    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="face front" id="f-glob" data-opp="f-souv" data-name="GLOBALISME" data-score="0">GLOBALISME</div>
            <div class="face back" id="f-souv" data-opp="f-glob" data-name="SOUVERAINISME" data-score="0">SOUVERAINISME</div>
            <div class="face right" id="f-egal" data-opp="f-meri" data-name="ÉGALITARISME" data-score="0">ÉGALITARISME</div>
            <div class="face left" id="f-meri" data-opp="f-egal" data-name="MÉRITOCRATIE" data-score="0">MÉRITOCRATIE</div>
            <div class="face top" id="f-tech" data-opp="f-popu" data-name="TECHNOCRATIE" data-score="0">TECHNOCRATIE</div>
            <div class="face bottom" id="f-popu" data-opp="f-tech" data-name="POPULISME" data-score="0">POPULISME</div>
        </div>
    </div>
    
    <div id="control-widget">
        <div class="widget-title" id="act-name">Clivage</div>
        <div class="scroll-instruction">Faites tourner la molette pour ajuster</div>
    </div>
    
    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');
        const widget = document.getElementById('control-widget');
        const wTitle = document.getElementById('act-name');
        
        let drag = false;
        let cX = -20; let cY = 20;
        let rX = -20; let rY = 20;
        let vX = 0; let vY = 0;
        let lX = 0; let lY = 0;
        let sel = null;
        
        scene.addEventListener('mousedown', (e) => {
            drag = true; vX = 0; vY = 0;
            lX = e.clientX; lY = e.clientY;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!drag) return;
            const dX = e.clientX - lX;
            const dY = e.clientY - lY;
            vY = dX * 0.35; vX = dY * 0.35;
            cY += vY; cX -= vX;
            lX = e.clientX; lY = e.clientY;
        });
        
        window.addEventListener('mouseup', () => { drag = false; });
        
        scene.addEventListener('touchstart', (e) => {
            drag = true; vX = 0; vY = 0;
            lX = e.touches[0].clientX; lY = e.touches[0].clientY;
        }, { passive: true });
        
        window.addEventListener('touchmove', (e) => {
            if (!drag) return;
            const dX = e.touches[0].clientX - lX;
            const dY = e.touches[0].clientY - lY;
            vY = dX * 0.35; vX = dY * 0.35;
            cY += vY; cX -= vX;
            lX = e.touches[0].clientX; lY = e.touches[0].clientY;
        }, { passive: true });
        
        window.addEventListener('touchend', () => { drag = false; });

        function phys() {
            if (!drag) {
                vX *= 0.975; vY *= 0.975;
                cY += vY; cX -= vX;
            }
            rX += (cX - rX) * 0.12;
            rY += (cY - rY) * 0.12;
            cube.style.transform = `rotateX(${rX}deg) rotateY(${rY}deg)`;
            requestAnimationFrame(phys);
        }
        phys();

        function color(f) {
            const s = parseInt(f.getAttribute('data-score'));
            const n = f.getAttribute('data-name');
            const opp = document.getElementById(f.getAttribute('data-opp'));
            const oName = opp.getAttribute('data-name');
            
            if (s > 0) {
                f.style.background = `rgba(0,122,255,${0.2+(s*0.07)})`;
                f.style.color = s > 5 ? '#fff' : '#1c1c1e';
                f.style.borderColor = '#0056b3';
                f.innerText = n + " : +" + s;
                f.classList.remove('locked');
                
                const scoreInverse = -(20 - s);
                opp.classList.add('locked');
                opp.innerText = oName + " : " + scoreInverse;
                opp.style.background = ''; 
                opp.style.color = '';
            } else {
                f.style.background = 'rgba(255,255,255,0.9)';
                f.style.color = '#1c1c1e';
                f.style.borderColor = '#007aff';
                f.innerText = n;
                
                opp.classList.remove('locked');
                opp.style.background = 'rgba(255,255,255,0.9)';
                opp.style.color = '#1c1c1e';
                opp.style.borderColor = '#007aff';
                opp.innerText = oName;
            }
        }

        faces.forEach(f => {
            f.addEventListener('click', () => {
                if (Math.abs(vX) > 0.3 || Math.abs(vY) > 0.3 || f.classList.contains('locked')) return;
                
                if (sel && sel !== f && !sel.classList.contains('locked')) {
                    color(sel);
                }
                
                sel = f;
                if (parseInt(f.getAttribute('data-score')) === 0) {
                    f.style.background = 'rgba(0, 122, 255, 0.4)';
                }
                
                widget.classList.add('visible');
                wTitle.innerText = f.getAttribute('data-name') + " (+" + f.getAttribute('data-score') + ")";
            });
        });

        window.addEventListener('wheel', (e) => {
            if (sel && !sel.classList.contains('locked')) {
                e.preventDefault();
                let s = parseInt(sel.getAttribute('data-score'));
                s = e.deltaY < 0 ? Math.min(s + 1, 10) : Math.max(s - 1, 0);
                
                sel.setAttribute('data-score', s);
                color(sel);
                wTitle.innerText = sel.getAttribute('data-name') + " (+" + s + ")";
            }
        }, { passive: false });
    </script>
</body>
</html>
