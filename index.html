<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agora-15 | Inertie Fluide</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
            user-select: none;
        }
        h1 { position: absolute; top: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }
        p { position: absolute; top: 80px; color: #8e8e93; font-size: 14px; text-align: center; padding: 0 20px; }
        
        .scene { width: 220px; height: 220px; perspective: 600px; margin-top: 50px; cursor: grab; }
        .scene:active { cursor: grabbing; }
        
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            will-change: transform; /* Optimisation pour carte graphique */
        }
        
        .face {
            position: absolute; width: 220px; height: 220px;
            border: 2px solid #007aff;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; text-align: center;
            box-sizing: border-box; padding: 10px;
            box-shadow: inset 0 0 20px rgba(0, 122, 255, 0.05);
            backface-visibility: visible;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        
        .face.active {
            background: rgba(0, 122, 255, 0.8) !important;
            color: #ffffff !important;
            border-color: #0056b3;
        }
        
        .front  { transform: rotateY(  0deg) translateZ(110px); }
        .back   { transform: rotateY(180deg) translateZ(110px); }
        .right  { transform: rotateY( 90deg) translateZ(110px); }
        .left   { transform: rotateY(-90deg) translateZ(110px); }
        .top    { transform: rotateX( 90deg) translateZ(110px); }
        .bottom { transform: rotateX(-90deg) translateZ(110px); }
    </style>
</head>
<body>

    <h1>Agora-15</h1>
    <p>Étape 4.5 : Test d'inertie ultra-fluide cinétique</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="face front">GLOBALISME</div>
            <div class="face back">SOUVERAINISME</div>
            <div class="face right">ÉGALITARISME</div>
            <div class="face left">MÉRITOCRATIE</div>
            <div class="face top">TECHNOCRATIE</div>
            <div class="face bottom">POPULISME</div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const faces = document.querySelectorAll('.face');

        let estEnTrainDeGlisser = false;
        
        // Positions cibles (où le cube VEUT aller)
        let cibleX = -20;
        let cibleY = 20;
        
        // Positions actuelles (où le cube EST réellement, calculé en continu)
        let rotationX = -20;
        let rotationY = 20;

        let vitesseX = 0;
        let vitesseY = 0;
        let dernierX = 0;
        let dernierY = 0;
        
        // Paramètres physiques ajustés pour un effet velours
        const friction = 0.975; // Glisse plus longue et soyeuse
        const sensibilite = 0.35;

        function CommencerGlisser(e) {
            estEnTrainDeGlisser = true;
            vitesseX = 0;
            vitesseY = 0;
            
            dernierX = e.clientX || (e.touches && e.touches[0].clientX);
            dernierY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        function Glisser(e) {
            if (!estEnTrainDeGlisser) return;
            
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            const deltaX = x - dernierX;
            const deltaY = y - dernierY;

            vitesseY = deltaX * sensibilite;
            vitesseX = deltaY * sensibilite;

            cibleY += vitesseY;
            cibleX -= vitesseX;

            dernierX = x;
            dernierY = y;
        }

        function ArreterGlisser() {
            estEnTrainDeGlisser = false;
        }

        scene.addEventListener('mousedown', CommencerGlisser);
        window.addEventListener('mousemove', Glisser);
        window.addEventListener('mouseup', ArreterGlisser);

        scene.addEventListener('touchstart', CommencerGlisser, { passive: true });
        window.addEventListener('touchmove', Glisser, { passive: true });
        window.addEventListener('touchend', ArreterGlisser);

        // --- ENGIN DE SMOOTHING ET DE PHYSIQUE CONTINU ---
        function bouclePhysique() {
            if (!estEnTrainDeGlisser) {
                // Ralentissement progressif de la vitesse
                vitesseX *= friction;
                vitesseY *= friction;

                // Application de la vitesse restante sur la cible
                cibleY += vitesseY;
                cibleX -= vitesseX;
            }

            // L'interpolation linéaire (LERP) : le secret de la fluidité absolue.
            // On avance vers la cible par tranche de 12% à chaque image.
            rotationX += (cibleX - rotationX) * 0.12;
            rotationY += (cibleY - rotationY) * 0.12;

            cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            
            requestAnimationFrame(bouclePhysique);
        }
        
        bouclePhysique();

        // --- CLIC FACE ---
        faces.forEach(face => {
            face.addEventListener('click', (e) => {
                if (Math.abs(vitesseX) > 0.3 || Math.abs(vitesseY) > 0.3) return;
                faces.forEach(f => f.classList.remove('active'));
                face.classList.add('active');
            });
        });
    </script>
</body>
</html>
